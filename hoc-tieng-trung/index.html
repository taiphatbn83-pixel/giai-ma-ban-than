<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Học tiếng Trung HSK</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b3261e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Học tiếng Trung">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--red:#b3261e;--gold:#f2b33d;--bg:light-dark(#fffaf5,#151010);--ink:light-dark(#2a1a17,#f3e9e4);--mut:light-dark(#76605a,#b9a49d);--card:light-dark(#ffffff,#211918);--line:light-dark(#efdfd6,#3a2d2a);--soft:light-dark(#fdeee6,#2c201e);--ok:#1f9d55;--bad:#d64545;--okbg:light-dark(#e5f6ec,#173324);--badbg:light-dark(#fde8e8,#3a1c1c)}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.zh{font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
header.top{background:var(--red);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header.top .logo{width:36px;height:36px;border-radius:10px;background:var(--gold);color:var(--red);display:grid;place-items:center;font:800 22px "Noto Sans SC",sans-serif}
header.top b{font-size:18px}
header.top small{display:block;font-size:12px;color:#ffe2d9}
main{max-width:760px;margin:0 auto;padding:16px}
h2{font-size:24px;line-height:1.2;margin:4px 0 8px}
h3{font-size:18px;margin:26px 0 10px}
h4{margin:0 0 8px}
.lead{color:var(--mut);margin:0 0 14px}
.small,small{font-size:13px;color:var(--mut)}
.note{font-size:14px;color:var(--mut);background:var(--soft);border-radius:12px;padding:12px 14px;margin:14px 0}
.warn{background:#fff3cd;color:#5c4400;border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 15px inherit;font-family:inherit;border:0;border-radius:12px;background:var(--red);color:#fff;padding:11px 16px;min-height:44px;cursor:pointer;text-decoration:none}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.big{width:100%;font-size:17px;min-height:52px;margin-top:10px}
.btn:disabled{opacity:.45}
.ib{font-size:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;min-width:44px;height:44px;cursor:pointer;display:inline-grid;place-items:center;padding:0 8px;font-family:inherit}
.ib.on{background:#fff4d6;border-color:var(--gold)}
.ib.lg{min-width:56px;height:52px;font-size:22px}
.ib.xl{width:96px;height:96px;font-size:44px;border-radius:50%;margin:8px auto;display:grid}
.ib.txt{font-size:15px;font-weight:600}
.ib.mic{background:var(--red);color:#fff;border-color:var(--red)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chips,.toggles{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{font:600 14px inherit;font-family:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer}
.chip.sm{font-size:13px;padding:6px 12px;min-height:36px}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.tag{font-size:11px;font-weight:700;background:var(--gold);color:#4a3000;border-radius:6px;padding:1px 6px;vertical-align:2px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mid{color:#c07a00}
.hide-py .py,.hide-py .bub .pyb{display:none}.hide-vi .vi{display:none}.hide-mean .bub .mean,.hide-mean .vsub .mean{display:none}
.vi{color:var(--mut);font-size:14px;font-style:italic}
.pyb{color:var(--red);font-weight:600}
@media (prefers-color-scheme:dark){.pyb{color:#ff8a7a}}
/* trang chủ */
.hero{background:linear-gradient(135deg,var(--red),#d9472f);color:#fff;border-radius:20px;padding:20px}
.hero h2{color:#fff}.hero p{margin:0 0 12px;opacity:.92}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps li{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px;line-height:1.3}
.steps span{display:block;font-size:24px}.steps b{display:block;font-size:13px;margin:2px 0}
.cta{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--red);border-radius:18px;padding:14px 16px;margin:14px 0 0;color:inherit;text-decoration:none}
.cta.alt{border-color:var(--gold)}
.cta .big{font-size:36px;width:52px;text-align:center;font-family:"Noto Sans SC",sans-serif;color:var(--red)}
.cta>span:nth-child(2){flex:1;display:flex;flex-direction:column}.cta b{font-size:18px}.cta .arr{font-size:30px;color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-size:13px;color:var(--mut)}
.stats b{display:block;font-size:22px;color:var(--ink)}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.lv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.lv b{font-size:20px;color:var(--red);margin-right:6px}.lv span{font-size:13px;font-weight:600}.lv small{display:block}.lv p{margin:6px 0 0;font-size:13px}
.lv.soon{opacity:.7;cursor:default}
/* pinyin */
.tones{display:grid;gap:10px}
.tone{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.th{display:flex;gap:12px;align-items:center;margin-bottom:8px}.th small{display:block}
.tsvg{width:54px;height:40px;flex:none;background:var(--soft);border-radius:8px}
.tsvg path{fill:none;stroke:var(--red);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.tex,.tchoices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tchoices{grid-template-columns:repeat(4,1fr);margin:10px 0}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px;cursor:pointer;font-family:inherit}
.tbtn .zh{font-size:28px}.tbtn.right{background:var(--okbg);border-color:var(--ok)}.tbtn.wrongc{background:var(--badbg);border-color:var(--bad)}
.tbtn .tsvg{width:44px;height:32px}
.game{background:var(--soft);border:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pc{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 4px;cursor:pointer;font-family:inherit}
.pc b{font-size:22px;color:var(--red)}.pc .zh{font-size:20px}.pc small{font-size:12px;text-align:center}
.rules{padding-left:18px;margin:0}.rules li{margin:8px 0}
/* bài học */
.lrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0;color:inherit;text-decoration:none}
.lrow.done{border-color:var(--ok)}
.li{font-size:30px;width:44px;text-align:center;font-family:"Noto Sans SC",sans-serif;color:var(--red)}
.lt{flex:1;display:flex;flex-direction:column}.ls{display:flex;flex-direction:column;align-items:flex-end}
.back{display:inline-block;color:var(--red);text-decoration:none;font-weight:600;padding:6px 0;background:none;border:0;font:600 15px inherit;font-family:inherit;cursor:pointer}
.lhead{display:flex;gap:12px;align-items:center;margin:4px 0 10px}.lhead h2{margin:0}
.seg{display:grid;grid-template-columns:repeat(5,1fr);background:var(--soft);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px;position:sticky;top:60px;z-index:4}
.seg a{text-align:center;padding:9px 1px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:12.5px;font-weight:600;line-height:1.25}
.seg a.on{background:var(--red);color:#fff}
/* thẻ */
.fcbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.fcard{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:24px 16px;text-align:center;cursor:pointer;box-shadow:0 6px 20px rgba(120,40,20,.08)}
.fcard .em{font-size:64px;line-height:1.1}.fz{font-size:72px;line-height:1.2;margin:6px 0}
.fcard .pyb{font-size:24px}.fcard .vi{font-size:17px}.fcard .mean{font-size:19px;font-weight:600;margin-top:6px}.hint{display:block;margin-top:8px}
.fcnav{display:flex;justify-content:center;gap:10px;margin:14px 0}
.speak{text-align:center;background:var(--soft);border-radius:16px;padding:12px}
.speak .ib.mic{width:72px;height:72px;border-radius:50%;font-size:32px}
.micout{min-height:6px;font-size:14px;margin-top:6px}.micout:empty{display:none}
.rec{color:var(--red);font-weight:600;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.4}}
/* hội thoại */
.pbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.pbar.center{justify-content:center}
.dlg{display:flex;flex-direction:column;gap:10px}
.bub{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 14px;max-width:92%;align-self:flex-start;transition:box-shadow .2s}
.bub.me{align-self:flex-end;background:var(--soft);border-radius:18px 18px 4px 18px}
.bub.cur{box-shadow:0 0 0 3px var(--gold)}
.who{font-size:12px;font-weight:700;color:var(--red)}
.dz{font-size:24px;line-height:1.4;cursor:pointer}
.bub .py{color:var(--red);font-weight:500}
.bub .mean{margin-top:4px}
.bact{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}.bact .micout{flex-basis:100%}
.tip{background:#fff8e6;border-color:#f5d78e}@media (prefers-color-scheme:dark){.tip{background:#2c2414;border-color:#5c4a20}}
.tip p{margin:6px 0 0}
/* từ */
.wrow{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.wz{font-size:30px;min-width:56px;text-align:center;cursor:pointer;line-height:1.3}
.wm{flex:1}.wa{display:flex;gap:6px}
.ctx{margin-top:6px;font-size:16px;background:var(--soft);border-radius:8px;padding:4px 8px;cursor:pointer}
mark{background:var(--gold);color:#3a2600;border-radius:3px;padding:0 1px}
.search{width:100%;font:16px inherit;font-family:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0}
/* ôn tập */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;color:var(--ink);font-family:inherit;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:28px}.tile b{font-size:16px}.tile:disabled{opacity:.55}
/* kiểm tra */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut)}
.prog{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;background:var(--red)}
.quiz{text-align:center}
.qt{font-weight:700;font-size:17px}
.qz{font-size:64px;cursor:pointer;line-height:1.2}.qem{font-size:56px}.qmean{font-size:20px;font-weight:600;margin:6px 0 10px}
.opts{display:grid;gap:10px;margin:14px 0}.opts.zhopts{grid-template-columns:1fr 1fr}
.opt{font:500 17px inherit;font-family:inherit;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:14px;min-height:56px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.zhopts .opt .zh{font-size:28px}
.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrongc{background:var(--badbg);border-color:var(--bad)}
.built,.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:60px;padding:10px;border-radius:14px;margin:10px 0}
.built{background:var(--soft);border:2px dashed var(--line)}
.tok{font-size:22px;font-family:"Noto Sans SC",sans-serif;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.fb{border-radius:16px;padding:14px;margin:14px 0;text-align:center}.fb.ok{background:var(--okbg);color:inherit}.fb.bad{background:var(--badbg);color:inherit}
.fbz{font-size:26px;display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0}
.result{text-align:center}.rs{font-size:64px}
/* video */
.vplayer{background:var(--bg)}
.vplayer.vfull{position:fixed;inset:0;z-index:50;overflow:auto;padding:calc(10px + env(safe-area-inset-top)) 10px 10px}
.noscroll{overflow:hidden}
.vstage{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,var(--b1),var(--b2));height:clamp(420px,62vh,560px);color:#2a1a17;box-shadow:0 6px 20px rgba(0,0,0,.1)}
.vfull .vstage{height:calc(100vh - 230px);min-height:380px}
.vprops span{position:absolute;font-size:clamp(28px,7vw,44px);opacity:.85}
.vtitle{position:absolute;left:12px;top:10px;background:rgba(255,255,255,.8);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;z-index:2}
.vfloor{position:absolute;left:0;right:0;top:66%;height:6px;background:rgba(0,0,0,.06)}
.vchars{position:absolute;left:0;right:0;top:18%;display:flex;justify-content:space-around;align-items:flex-end;padding:0 4%;z-index:1}
.vch{position:relative;display:flex;flex-direction:column;align-items:center;width:30%;max-width:150px;transition:transform .3s,opacity .3s;opacity:.75}
.vch.act{opacity:1;transform:translateY(-6px) scale(1.06)}
.av{width:100%;height:auto;display:block}
.vname{font-size:12px;font-weight:700;background:rgba(255,255,255,.85);border-radius:999px;padding:1px 8px;margin-top:-6px;white-space:nowrap}
.vbub{position:absolute;bottom:100%;margin-bottom:6px;background:#fff;border-radius:14px;padding:6px 10px;font-size:clamp(15px,4vw,20px);box-shadow:0 3px 10px rgba(0,0,0,.15);width:max-content;max-width:min(230px,60vw);opacity:0;transform:translateY(6px);transition:.25s;pointer-events:none}
.vch.me .vbub{right:0}.vch:not(.me) .vbub{left:0}
.vbub.on{opacity:1;transform:none}
.vbub::after{content:"";position:absolute;bottom:-7px;left:24px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}.vch.me .vbub::after{left:auto;right:24px}
.mouth{transform-box:fill-box;transform-origin:center}.talk .mouth{animation:talk .2s infinite alternate}@keyframes talk{to{transform:scaleY(3.4)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}@keyframes blink{0%,95%,100%{transform:none}97%{transform:scaleY(.1)}}
.talk .av{animation:bob .45s infinite alternate}@keyframes bob{to{transform:translateY(-3px)}}
.vsub{position:absolute;left:0;right:0;bottom:0;background:rgba(20,12,10,.78);color:#fff;padding:10px 14px 12px;text-align:center;min-height:30%;display:flex;flex-direction:column;justify-content:center;gap:2px}
.vsub .vz{font-size:clamp(22px,6vw,30px);line-height:1.3}.vsub .py{color:#ffcf6e;font-weight:600}.vsub .vi{color:#e7dcd8}.vsub .mean{color:#fff;font-size:15px}
.vbig{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:36px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:3}
.vprog{display:flex;gap:4px;margin:10px 0}.vdot{flex:1;height:8px;border:0;border-radius:4px;background:var(--line);cursor:pointer;padding:0}.vdot.past{background:#e9a197}.vdot.cur{background:var(--red)}
.vctl{display:flex;justify-content:center;gap:10px}
.vz2{font-size:24px;margin:4px 0}.center{text-align:center}
@media (prefers-reduced-motion:reduce){.talk .av,.eyes{animation:none}}
/* thanh tab dưới */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px;font-size:11px;color:var(--mut);text-decoration:none;font-weight:600;min-height:58px}
.tabbar a span{font-size:22px;line-height:1.2;font-family:"Noto Sans SC",system-ui,sans-serif}
.tabbar a.on{color:var(--red)}
@media (max-width:420px){.steps{grid-template-columns:repeat(2,1fr)}.fz{font-size:60px}.dz{font-size:22px}}
</style>
</head>
<body>
<header class="top"><span class="logo">中</span><div><b>Học tiếng Trung</b><small>HSK 1 → 6 · nghe, nói, hội thoại</small></div></header>
<main id="view"></main>
<nav class="tabbar" aria-label="Điều hướng"></nav>
<script>
// ===== DỮ LIỆU: HSK1 (đầy đủ) — mỗi dòng: chữ|pinyin (cách âm tiết bằng dấu cách)|nghĩa|hình =====
const RAW_HSK1 = `
# Chào hỏi & lịch sự
谢谢|xiè xie|cảm ơn|🙏
不客气|bú kè qi|không có gì (đáp lại cảm ơn)|😊
再见|zài jiàn|tạm biệt|👋
请|qǐng|mời; xin, vui lòng|🤲
对不起|duì bu qǐ|xin lỗi|🙇
没关系|méi guān xi|không sao|👌
喂|wèi|alô (nghe điện thoại)|📞
# Đại từ & từ để hỏi
我|wǒ|tôi, mình|🙋
你|nǐ|bạn, anh, chị|👉
他|tā|anh ấy, ông ấy|👨
她|tā|cô ấy, bà ấy|👩
我们|wǒ men|chúng tôi, chúng ta|👨‍👩‍👧
这|zhè|đây, này|👇
那|nà|kia, đó; vậy thì|👉
哪|nǎ|nào|❓
哪儿|nǎr|ở đâu|📍
谁|shéi|ai|🕵️
什么|shén me|cái gì|❓
多少|duō shao|bao nhiêu|🔢
几|jǐ|mấy (thường dưới 10)|✋
怎么|zěn me|thế nào, sao|🤔
怎么样|zěn me yàng|như thế nào|🤔
# Số đếm & lượng từ
零|líng|số không|0️⃣
一|yī|một|1️⃣
二|èr|hai|2️⃣
三|sān|ba|3️⃣
四|sì|bốn|4️⃣
五|wǔ|năm|5️⃣
六|liù|sáu|6️⃣
七|qī|bảy|7️⃣
八|bā|tám|8️⃣
九|jiǔ|chín|9️⃣
十|shí|mười|🔟
个|gè|cái, chiếc (lượng từ chung)|📦
岁|suì|tuổi|🎂
本|běn|quyển (lượng từ cho sách)|📘
些|xiē|một vài, những|🔹
块|kuài|đồng (tiền); miếng|💴
一点儿|yì diǎnr|một chút|🤏
# Con người & gia đình
人|rén|người|🧍
爸爸|bà ba|bố|👨
妈妈|mā ma|mẹ|👩
儿子|ér zi|con trai|👦
女儿|nǚ ér|con gái|👧
老师|lǎo shī|giáo viên|👩‍🏫
学生|xué sheng|học sinh|🧑‍🎓

// --- Giọng đọc tiếng Trung ---
let VOICES=[];const loadV=()=>{VOICES=(window.speechSynthesis?.getVoices()||[])};if(window.speechSynthesis){loadV();speechSynthesis.onvoiceschanged=()=>{loadV();if(location.hash===''||location.hash==='#home')render()}}
const zhVoice=()=>VOICES.find(v=>/zh[-_]CN/i.test(v.lang))||VOICES.find(v=>/^(zh|cmn)/i.test(v.lang))||VOICES.find(v=>/chinese|中文|普通话|mandarin/i.test(v.name));
let speakTok=0;
function speak(text,o={}){if(!window.speechSynthesis){o.onend&&o.onend();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';const v=zhVoice();if(v)u.voice=v;
  u.rate=o.rate??(S.slow?0.55:0.85);u.pitch=o.pitch??1;const tok=++speakTok;const done=()=>{if(tok===speakTok&&o.onend)o.onend()};u.onend=done;u.onerror=done;speechSynthesis.speak(u)}
function stopAll(){speakTok++;window.speechSynthesis&&speechSynthesis.cancel();clearTimeout(autoT);auto=false;playing=false;typeof vStop==='function'&&vStop()}

// --- Nhận giọng nói (luyện nói) ---
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const onlyZh=s=>(s||'').replace(/[0-9]/g,d=>'零一二三四五六七八九'[d]).replace(/[^㐀-鿿]/g,'');
function lcs(a,b){const d=Array(b.length+1).fill(0);for(const x of a){let prev=0;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=x===b[j-1]?prev+1:Math.max(d[j],d[j-1]);prev=t}}return d[b.length]}
function listen(target,out){out.innerHTML='';if(!SR){out.innerHTML='<span class="bad">Trình duyệt này chưa hỗ trợ nhận giọng nói. Hãy dùng Chrome trên Android hoặc máy tính; trên iPhone dùng Safari bản mới.</span>';return}
  stopAll();const r=new SR();r.lang='zh-CN';r.interimResults=false;r.maxAlternatives=5;out.innerHTML='<span class="rec">🎙️ Đang nghe… hãy nói</span>';
  r.onresult=e=>{const tz=onlyZh(target);let best={t:'',s:0};for(const a of e.results[0]){const t=a.transcript,s=tz.length?lcs(onlyZh(t),tz)/Math.max(tz.length,onlyZh(t).length):0;if(s>=best.s)best={t,s}}
    const p=Math.round(best.s*100);out.innerHTML=`<span class="${p>=80?'ok':p>=50?'mid':'bad'}">${p>=80?'🎉 Rất tốt!':p>=50?'👍 Gần đúng, thử lại nhé':'🔁 Chưa đúng, nghe lại rồi nói'} · ${p}%</span><br><span class="zh small">Máy nghe được: ${esc(best.t)||'…'}</span>`};
  r.onerror=e=>{out.innerHTML=`<span class="bad">${e.error==='not-allowed'||e.error==='service-not-allowed'?'Bạn cần cho phép dùng micro.':e.error==='no-speech'?'Không nghe thấy gì, thử lại nhé.':'Lỗi nhận giọng: '+esc(e.error)}</span>`};
  r.onend=()=>{if(out.querySelector('.rec'))out.innerHTML='<span class="bad">Không nghe thấy gì, thử lại nhé.</span>'};
  try{r.start()}catch(e){out.innerHTML='<span class="bad">Không mở được micro.</span>'}}

const toneSvg=t=>{const p={1:'M6 8 L54 8',2:'M6 34 L54 6',3:'M6 18 L26 38 L54 10',4:'M6 6 L54 38'}[t];return`<svg viewBox="0 0 60 44" class="tsvg" aria-hidden="true"><path d="${p}"/></svg>`};
let toneGame=null;
function vPinyin(){return`${voiceWarn()}<h2>Pinyin nhập môn</h2><p class="lead">Trẻ em Trung Quốc vào lớp 1 học pinyin trước khi học chữ. Pinyin là cách ghi âm tiếng Trung bằng chữ cái Latin, gồm <b>thanh mẫu</b> (phụ âm đầu), <b>vận mẫu</b> (vần) và <b>thanh điệu</b>. Bấm vào ô bất kỳ để nghe.</p>
 <h3>1. Bốn thanh điệu</h3><div class="tones">${TONES.map(t=>`<div class="tone"><div class="th">${toneSvg(t.t)}<div><b>${t.name}</b><small>${t.vi}</small></div></div><div class="tex">${t.ex.map(e=>`<button class="tbtn" data-act="say" data-zh="${e[0]}"><span class="zh">${e[0]}</span><span class="pyb">${e[1]}</span><small>${e[2]}</small></button>`).join('')}</div></div>`).join('')}</div>
 <p class="note">Ngoài ra có <b>thanh nhẹ</b> (không dấu), đọc ngắn và nhẹ, ví dụ 妈妈 mā<b>ma</b>, 吗 ma.</p>
 <div class="card game"><h4>🎯 Trò chơi: nghe đoán thanh</h4><div id="tg">${tgView()}</div></div>
 <h3>2. Thanh mẫu (phụ âm đầu)</h3><div class="pgrid">${INITIALS.map(([k,z,p])=>`<button class="pc" data-act="say" data-zh="${z}"><b>${k}</b><span class="zh">${z}</span><small>${p} · ${toVi(p)}</small></button>`).join('')}</div>
 <h3>3. Vận mẫu (vần)</h3><div class="pgrid">${FINALS.map(([k,z,p])=>`<button class="pc" data-act="say" data-zh="${z}"><b>${k}</b><span class="zh">${z}</span><small>${p} · ${toVi(p)}</small></button>`).join('')}</div>
 <h3>4. Quy tắc biến điệu cần nhớ</h3><div class="card"><ul class="rules"><li>Hai thanh 3 đứng liền nhau thì chữ đầu đọc thành thanh 2: 你好 nǐ hǎo đọc là <b>ní hǎo</b>. ${btnSay('你好')}</li><li>不 (bù) đứng trước thanh 4 đọc thành <b>bú</b>: 不是 bú shì. ${btnSay('不是')}</li><li>一 (yī) đứng trước thanh 4 đọc <b>yí</b>, trước thanh 1, 2, 3 đọc <b>yì</b>: 一个 yí ge, 一些 yì xiē. ${btnSay('一个')}</li></ul><p class="small">Trong app, pinyin đã ghi theo cách đọc thực tế sau biến điệu của 不 và 一.</p></div>
 <h3>5. Cách đọc phần phiên âm tiếng Việt</h3><div class="card"><p>Dòng phiên âm tiếng Việt chỉ giúp đọc gần đúng lúc mới học. Luôn nghe giọng đọc và nhìn pinyin để phát âm chuẩn.</p><ul class="rules"><li>Thanh 1 → không dấu, thanh 2 → dấu sắc, thanh 3 → dấu hỏi, thanh 4 → dấu huyền, thanh nhẹ → không dấu.</li><li>Dấu <b>'</b> nghĩa là bật hơi mạnh: p' (p), ch' (q), tr' (ch), ts' (c). Còn t → th, k → kh.</li><li>zh đọc gần "tr" uốn lưỡi, sh gần "s" uốn lưỡi, r gần "r" nhẹ, z gần "ch" đầu lưỡi, x gần "x" bẹt.</li><li>ü đọc tròn môi như "uy". (r) ở cuối là âm cuốn lưỡi "nhi hóa", như 哪儿 nǎr.</li></ul></div>`}
function tgView(){if(!toneGame)return`<p class="small">Máy đọc một chữ, bạn chọn thanh điệu đúng. 10 lượt.</p><button class="btn" data-act="tgStart">Bắt đầu chơi</button>`;
 const g=toneGame;if(g.i>=10)return`<p><b>Bạn đúng ${g.score}/10.</b> ${g.score>=8?'Tai rất thính! 🎉':'Nghe thêm vài lần nữa nhé.'}</p><button class="btn" data-act="tgStart">Chơi lại</button>`;

const TV={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
function pyMark(base,t){if(t===5)return base;let i=base.search(/[ae]/);if(i<0)i=base.indexOf('ou');if(i<0)for(let k=base.length-1;k>=0;k--)if('iouü'.includes(base[k])){i=k;break}return i<0?base:base.slice(0,i)+TV[base[i]][t-1]+base.slice(i+1)}
function toneVariants(py){const sy=py.split(' ');const set=new Set([py]);let guard=0;while(set.size<4&&guard++<60){const v=sy.map(s=>{const {base,tone}=parseSyl(s);if(tone===5||Math.random()<.4)return s.toLowerCase()===s?s:s;let t;do{t=1+(Math.random()*4|0)}while(t===tone);const r=pyMark(base,t);return s[0]!==s[0].toLowerCase()?r[0].toUpperCase()+r.slice(1):r}).join(' ');set.add(v)}return shuffle([...set])}
function makeQ(w,type,pool){const others=pool.filter(x=>x.zh!==w.zh);const fill=BANK.filter(x=>x.zh!==w.zh);
 const distinct=(key,n)=>{const seen=new Set([w[key]]),res=[];for(const x of shuffle(others).concat(shuffle(fill))){if(!seen.has(x[key])){seen.add(x[key]);res.push(x)}if(res.length>=n)break}return res};
 if(type==='tone'){const opts=toneVariants(w.py);if(opts.length<2)type='meaning';else return{type,w,opts,ans:w.py}}
 const key=type==='meaning'?'mean':'zh';return{type,w,opts:shuffle([w,...distinct(key,3)]).map(x=>x[key]),ans:w[key]}}
function startQuiz(words,{lines=[],n=12,types=['listen','meaning','reverse','tone'],orders=3,ctx={}}){const qs=[];const ws=shuffle(words);
 const nw=Math.max(0,n-Math.min(orders,lines.length));ws.slice(0,nw).forEach((w,i)=>qs.push(makeQ(w,types[i%types.length],words)));
 pick(lines.filter(l=>segment(l[1]).length>=3&&segment(l[1]).length<=9),orders).forEach(l=>{const seg=segment(l[1]);let sh;do{sh=shuffle(seg)}while(seg.length>1&&sh.join('')===seg.join(''));qs.push({type:'order',line:l,seg,sh,built:[]})});

 if(done){const ok=Q.ans===true||Q.ans===q.ans;const z=q.type==='order'?q.line[1]:q.w.zh;const py=q.type==='order'?q.line[2]:q.w.py;const mean=q.type==='order'?q.line[3]:q.w.mean;

 go:b=>location.hash=b.dataset.to,
 back:()=>history.back(),
 tog:b=>{S[b.dataset.k]=!S[b.dataset.k];save();b.classList.toggle('on',S[b.dataset.k]);applyPrefs()},
 known:b=>{const z=b.dataset.zh;if(S.known[z])delete S.known[z];else S.known[z]=1;save();b.textContent=S.known[z]?'⭐':'☆';b.classList.toggle('on',!!S.known[z])},
 cprev:()=>{C.i=(C.i-1+C.pool.length)%C.pool.length;$('#cards').innerHTML=cardView();speak(C.pool[C.i].zh)},
 cnext:()=>{C.i=(C.i+1)%C.pool.length;$('#cards').innerHTML=cardView();speak(C.pool[C.i].zh)},
 auto:()=>{if(auto){stopAll()}else{auto=true;runAuto()}$('#cards').innerHTML=cardView()},
 playAll:b=>{stopAll();playAll(LESSONS.find(L=>L.id==b.dataset.id))},
 stop:()=>{stopAll();document.querySelectorAll('.bub').forEach(x=>x.classList.remove('cur'))},
 tgStart:()=>{toneGame={i:0,score:0};tgNew();$('#tg').innerHTML=tgView()},
 tgPlay:()=>speak(toneGame.cur.zh),
 tgAns:b=>{const t=+b.dataset.t;toneGame.ans=t;if(t===toneGame.cur.t)toneGame.score++;$('#tg').innerHTML=tgView()},
 tgNext:()=>{toneGame.i++;if(toneGame.i<10)tgNew();$('#tg').innerHTML=tgView()},
 wlv:b=>{WF.lv=+b.dataset.lv;render()},
 wtopic:b=>{WF.topic=b.dataset.t;render()},
 wcards:()=>{C={key:'W',pool:wordList(),i:0,title:WF.topic||'Từ vựng HSK1'};location.hash='#cards'},
 wquiz:()=>{const ws=wordList();startQuiz(ws,{n:Math.min(15,Math.max(4,ws.length)),orders:0,ctx:{}})},
 quizLesson:b=>{const L=LESSONS.find(x=>x.id==b.dataset.id);startQuiz(lessonWords(L),{lines:L.lines,n:12,orders:3,ctx:{lesson:L.id}})},
 quizAll:()=>startQuiz(BANK,{lines:allLines(),n:20,orders:4,ctx:{}}),
 quizWrong:()=>{const ws=Object.keys(S.wrong).map(z=>DICT[z]).filter(Boolean);startQuiz(ws,{n:Math.min(15,ws.length),orders:0,ctx:{review:1}})},
 quizListen:()=>startQuiz(BANK,{n:15,types:['listen'],orders:0,ctx:{}}),
 quizOrder:()=>startQuiz([],{lines:allLines(),n:8,orders:8,ctx:{}}),
 answer:b=>answer(b.dataset.v),
 pickTok:b=>{Q.qs[Q.i].built.push(+b.dataset.i);render()},
 unpick:b=>{Q.qs[Q.i].built.splice(+b.dataset.i,1);render()},
 checkOrder:()=>{const q=Q.qs[Q.i];const ok=q.built.map(i=>q.sh[i]).join('')===q.seg.join('');Q.ans=ok?true:false;markResult(q,ok);render()},
 nextQ:()=>{Q.i++;Q.ans=null;Q.spoke=0;render();scrollTo(0,0)},
 redo:()=>{const qs=Q.qs.map(q=>q.type==='order'?{...q,built:[]}:q);Q={qs:shuffle(qs),i:0,score:0,wrongs:[],ctx:Q.ctx,ans:null};render()},
 quitQuiz:()=>{stopAll();history.length>1?history.back():location.hash='#review'},
 reset:()=>{if(confirm('Xóa toàn bộ tiến độ học?')){S.done={};S.best={};S.known={};S.wrong={};save();render()}},
};
Object.assign(ACT,ACT_V);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;e.preventDefault();ACT[b.dataset.act]?.(b,e)});
document.addEventListener('input',e=>{if(e.target.id==='wq'){WF.q=e.target.value;$('#wl').innerHTML=wlView();applyPrefs()}});
document.querySelector('.tabbar').innerHTML=TABS.map(([k,i,n])=>`<a href="#${k}" data-t="${k}"><span>${i}</span>${n}</a>`).join('');
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
</body>
</html>
