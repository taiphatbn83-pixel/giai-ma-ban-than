<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Học tiếng Trung HSK</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b3261e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Học tiếng Trung">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--red:#b3261e;--gold:#f2b33d;--bg:light-dark(#fffaf5,#151010);--ink:light-dark(#2a1a17,#f3e9e4);--mut:light-dark(#76605a,#b9a49d);--card:light-dark(#ffffff,#211918);--line:light-dark(#efdfd6,#3a2d2a);--soft:light-dark(#fdeee6,#2c201e);--ok:#1f9d55;--bad:#d64545;--okbg:light-dark(#e5f6ec,#173324);--badbg:light-dark(#fde8e8,#3a1c1c)}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.zh{font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
header.top{background:var(--red);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header.top .logo{width:36px;height:36px;border-radius:10px;background:var(--gold);color:var(--red);display:grid;place-items:center;font:800 22px "Noto Sans SC",sans-serif}
header.top b{font-size:18px}
header.top small{display:block;font-size:12px;color:#ffe2d9}
main{max-width:760px;margin:0 auto;padding:16px}
h2{font-size:24px;line-height:1.2;margin:4px 0 8px}
h3{font-size:18px;margin:26px 0 10px}
h4{margin:0 0 8px}
.lead{color:var(--mut);margin:0 0 14px}
.small,small{font-size:13px;color:var(--mut)}
.note{font-size:14px;color:var(--mut);background:var(--soft);border-radius:12px;padding:12px 14px;margin:14px 0}
.warn{background:#fff3cd;color:#5c4400;border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 15px inherit;font-family:inherit;border:0;border-radius:12px;background:var(--red);color:#fff;padding:11px 16px;min-height:44px;cursor:pointer;text-decoration:none}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.big{width:100%;font-size:17px;min-height:52px;margin-top:10px}
.btn:disabled{opacity:.45}
.ib{font-size:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;min-width:44px;height:44px;cursor:pointer;display:inline-grid;place-items:center;padding:0 8px;font-family:inherit}
.ib.on{background:#fff4d6;border-color:var(--gold)}
.ib.lg{min-width:56px;height:52px;font-size:22px}
.ib.xl{width:96px;height:96px;font-size:44px;border-radius:50%;margin:8px auto;display:grid}
.ib.txt{font-size:15px;font-weight:600}
.ib.mic{background:var(--red);color:#fff;border-color:var(--red)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chips,.toggles{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{font:600 14px inherit;font-family:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer}
.chip.sm{font-size:13px;padding:6px 12px;min-height:36px}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.tag{font-size:11px;font-weight:700;background:var(--gold);color:#4a3000;border-radius:6px;padding:1px 6px;vertical-align:2px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mid{color:#c07a00}
.hide-py .py,.hide-py .bub .pyb{display:none}.hide-vi .vi{display:none}.hide-mean .bub .mean,.hide-mean .vsub .mean{display:none}
.vi{color:var(--mut);font-size:14px;font-style:italic}
.pyb{color:var(--red);font-weight:600}
@media (prefers-color-scheme:dark){.pyb{color:#ff8a7a}}
/* trang chủ */
.hero{background:linear-gradient(135deg,var(--red),#d9472f);color:#fff;border-radius:20px;padding:20px}
.hero h2{color:#fff}.hero p{margin:0 0 12px;opacity:.92}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps li{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px;line-height:1.3}
.steps span{display:block;font-size:24px}.steps b{display:block;font-size:13px;margin:2px 0}
.cta{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--red);border-radius:18px;padding:14px 16px;margin:14px 0 0;color:inherit;text-decoration:none}
.cta.alt{border-color:var(--gold)}
.cta .big{font-size:36px;width:52px;text-align:center;font-family:"Noto Sans SC",sans-serif;color:var(--red)}
.cta>span:nth-child(2){flex:1;display:flex;flex-direction:column}.cta b{font-size:18px}.cta .arr{font-size:30px;color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-size:13px;color:var(--mut)}
.stats b{display:block;font-size:22px;color:var(--ink)}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.lv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.lv b{font-size:20px;color:var(--red);margin-right:6px}.lv span{font-size:13px;font-weight:600}.lv small{display:block}.lv p{margin:6px 0 0;font-size:13px}
.lv.soon{opacity:.7;cursor:default}
/* pinyin */
.tones{display:grid;gap:10px}
.tone{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.th{display:flex;gap:12px;align-items:center;margin-bottom:8px}.th small{display:block}
.tsvg{width:54px;height:40px;flex:none;background:var(--soft);border-radius:8px}
.tsvg path{fill:none;stroke:var(--red);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.tex,.tchoices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tchoices{grid-template-columns:repeat(4,1fr);margin:10px 0}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px;cursor:pointer;font-family:inherit}
.tbtn .zh{font-size:28px}.tbtn.right{background:var(--okbg);border-color:var(--ok)}.tbtn.wrongc{background:var(--badbg);border-color:var(--bad)}
.tbtn .tsvg{width:44px;height:32px}
.game{background:var(--soft);border:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pc{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 4px;cursor:pointer;font-family:inherit}
.pc b{font-size:22px;color:var(--red)}.pc .zh{font-size:20px}.pc small{font-size:12px;text-align:center}
.rules{padding-left:18px;margin:0}.rules li{margin:8px 0}
/* bài học */
.lrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0;color:inherit;text-decoration:none}
.lrow.done{border-color:var(--ok)}
.li{font-size:30px;width:44px;text-align:center;font-family:"Noto Sans SC",sans-serif;color:var(--red)}
.lt{flex:1;display:flex;flex-direction:column}.ls{display:flex;flex-direction:column;align-items:flex-end}
.back{display:inline-block;color:var(--red);text-decoration:none;font-weight:600;padding:6px 0;background:none;border:0;font:600 15px inherit;font-family:inherit;cursor:pointer}
.lhead{display:flex;gap:12px;align-items:center;margin:4px 0 10px}.lhead h2{margin:0}
.seg{display:grid;grid-template-columns:repeat(5,1fr);background:var(--soft);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px;position:sticky;top:60px;z-index:4}
.seg a{text-align:center;padding:9px 1px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:12.5px;font-weight:600;line-height:1.25}
.seg a.on{background:var(--red);color:#fff}
/* thẻ */
.fcbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.fcard{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:24px 16px;text-align:center;cursor:pointer;box-shadow:0 6px 20px rgba(120,40,20,.08)}
.fcard .em{font-size:64px;line-height:1.1}.fz{font-size:72px;line-height:1.2;margin:6px 0}
.fcard .pyb{font-size:24px}.fcard .vi{font-size:17px}.fcard .mean{font-size:19px;font-weight:600;margin-top:6px}.hint{display:block;margin-top:8px}
.fcnav{display:flex;justify-content:center;gap:10px;margin:14px 0}
.speak{text-align:center;background:var(--soft);border-radius:16px;padding:12px}
.speak .ib.mic{width:72px;height:72px;border-radius:50%;font-size:32px}
.micout{min-height:6px;font-size:14px;margin-top:6px}.micout:empty{display:none}
.rec{color:var(--red);font-weight:600;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.4}}
/* hội thoại */
.pbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.pbar.center{justify-content:center}
.dlg{display:flex;flex-direction:column;gap:10px}
.bub{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 14px;max-width:92%;align-self:flex-start;transition:box-shadow .2s}
.bub.me{align-self:flex-end;background:var(--soft);border-radius:18px 18px 4px 18px}
.bub.cur{box-shadow:0 0 0 3px var(--gold)}
.who{font-size:12px;font-weight:700;color:var(--red)}
.dz{font-size:24px;line-height:1.4;cursor:pointer}
.bub .py{color:var(--red);font-weight:500}
.bub .mean{margin-top:4px}
.bact{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}.bact .micout{flex-basis:100%}
.tip{background:#fff8e6;border-color:#f5d78e}@media (prefers-color-scheme:dark){.tip{background:#2c2414;border-color:#5c4a20}}
.tip p{margin:6px 0 0}
/* từ */
.wrow{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.wz{font-size:30px;min-width:56px;text-align:center;cursor:pointer;line-height:1.3}
.wm{flex:1}.wa{display:flex;gap:6px}
.ctx{margin-top:6px;font-size:16px;background:var(--soft);border-radius:8px;padding:4px 8px;cursor:pointer}
mark{background:var(--gold);color:#3a2600;border-radius:3px;padding:0 1px}
.search{width:100%;font:16px inherit;font-family:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0}
/* ôn tập */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;color:var(--ink);font-family:inherit;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:28px}.tile b{font-size:16px}.tile:disabled{opacity:.55}
/* kiểm tra */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut)}
.prog{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;background:var(--red)}
.quiz{text-align:center}
.qt{font-weight:700;font-size:17px}
.qz{font-size:64px;cursor:pointer;line-height:1.2}.qem{font-size:56px}.qmean{font-size:20px;font-weight:600;margin:6px 0 10px}
.opts{display:grid;gap:10px;margin:14px 0}.opts.zhopts{grid-template-columns:1fr 1fr}
.opt{font:500 17px inherit;font-family:inherit;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:14px;min-height:56px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.zhopts .opt .zh{font-size:28px}
.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrongc{background:var(--badbg);border-color:var(--bad)}
.built,.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:60px;padding:10px;border-radius:14px;margin:10px 0}
.built{background:var(--soft);border:2px dashed var(--line)}
.tok{font-size:22px;font-family:"Noto Sans SC",sans-serif;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.fb{border-radius:16px;padding:14px;margin:14px 0;text-align:center}.fb.ok{background:var(--okbg);color:inherit}.fb.bad{background:var(--badbg);color:inherit}
.fbz{font-size:26px;display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0}
.result{text-align:center}.rs{font-size:64px}
/* video */
.vplayer{background:var(--bg)}
.vplayer.vfull{position:fixed;inset:0;z-index:50;overflow:auto;padding:calc(10px + env(safe-area-inset-top)) 10px 10px}
.noscroll{overflow:hidden}
.vstage{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,var(--b1),var(--b2));height:clamp(420px,62vh,560px);color:#2a1a17;box-shadow:0 6px 20px rgba(0,0,0,.1)}
.vfull .vstage{height:calc(100vh - 230px);min-height:380px}
.vprops span{position:absolute;font-size:clamp(28px,7vw,44px);opacity:.85}
.vtitle{position:absolute;left:12px;top:10px;background:rgba(255,255,255,.8);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;z-index:2}
.vfloor{position:absolute;left:0;right:0;top:66%;height:6px;background:rgba(0,0,0,.06)}
.vchars{position:absolute;left:0;right:0;top:18%;display:flex;justify-content:space-around;align-items:flex-end;padding:0 4%;z-index:1}
.vch{position:relative;display:flex;flex-direction:column;align-items:center;width:30%;max-width:150px;transition:transform .3s,opacity .3s;opacity:.75}
.vch.act{opacity:1;transform:translateY(-6px) scale(1.06)}
.av{width:100%;height:auto;display:block}
.vname{font-size:12px;font-weight:700;background:rgba(255,255,255,.85);border-radius:999px;padding:1px 8px;margin-top:-6px;white-space:nowrap}
.vbub{position:absolute;bottom:100%;margin-bottom:6px;background:#fff;border-radius:14px;padding:6px 10px;font-size:clamp(15px,4vw,20px);box-shadow:0 3px 10px rgba(0,0,0,.15);width:max-content;max-width:min(230px,60vw);opacity:0;transform:translateY(6px);transition:.25s;pointer-events:none}
.vch.me .vbub{right:0}.vch:not(.me) .vbub{left:0}
.vbub.on{opacity:1;transform:none}
.vbub::after{content:"";position:absolute;bottom:-7px;left:24px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}.vch.me .vbub::after{left:auto;right:24px}
.mouth{transform-box:fill-box;transform-origin:center}.talk .mouth{animation:talk .2s infinite alternate}@keyframes talk{to{transform:scaleY(3.4)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}@keyframes blink{0%,95%,100%{transform:none}97%{transform:scaleY(.1)}}
.talk .av{animation:bob .45s infinite alternate}@keyframes bob{to{transform:translateY(-3px)}}
.vsub{position:absolute;left:0;right:0;bottom:0;background:rgba(20,12,10,.78);color:#fff;padding:10px 14px 12px;text-align:center;min-height:30%;display:flex;flex-direction:column;justify-content:center;gap:2px}
.vsub .vz{font-size:clamp(22px,6vw,30px);line-height:1.3}.vsub .py{color:#ffcf6e;font-weight:600}.vsub .vi{color:#e7dcd8}.vsub .mean{color:#fff;font-size:15px}
.vbig{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:36px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:3}
.vprog{display:flex;gap:4px;margin:10px 0}.vdot{flex:1;height:8px;border:0;border-radius:4px;background:var(--line);cursor:pointer;padding:0}.vdot.past{background:#e9a197}.vdot.cur{background:var(--red)}
.vctl{display:flex;justify-content:center;gap:10px}
.vz2{font-size:24px;margin:4px 0}.center{text-align:center}
@media (prefers-reduced-motion:reduce){.talk .av,.eyes{animation:none}}
.ytl2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.yt{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ytp{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;background:#000;cursor:pointer}
.ytp img{width:100%;height:100%;object-fit:cover;display:block;opacity:.9}
.ytb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:48px;border-radius:14px;background:#e62117;color:#fff;font-size:24px;display:grid;place-items:center}
.ytl{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;border-radius:4px;padding:1px 5px}
.ytf{aspect-ratio:16/9}.ytf iframe{width:100%;height:100%;border:0;display:block}
.ytm{padding:10px 12px}.ytm b{display:block;font-size:15px}.ytm a{color:var(--red)}
/* thanh tab dưới */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px;font-size:11px;color:var(--mut);text-decoration:none;font-weight:600;min-height:58px}
.tabbar a span{font-size:22px;line-height:1.2;font-family:"Noto Sans SC",system-ui,sans-serif}
.tabbar a.on{color:var(--red)}
@media (max-width:420px){.steps{grid-template-columns:repeat(2,1fr)}.fz{font-size:60px}.dz{font-size:22px}}
</style>
</head>
<body>
<header class="top"><span class="logo">中</span><div><b>Học tiếng Trung</b><small>HSK 1 → 6 · nghe, nói, hội thoại</small></div></header>
<main id="view"></main>
<nav class="tabbar" aria-label="Điều hướng"></nav>
<script>
// ===== DỮ LIỆU: HSK1 (đầy đủ) — mỗi dòng: chữ|pinyin (cách âm tiết bằng dấu cách)|nghĩa|hình =====
const RAW_HSK1 = `
# Chào hỏi & lịch sự
谢谢|xiè xie|cảm ơn|🙏
不客气|bú kè qi|không có gì (đáp lại cảm ơn)|😊
再见|zài jiàn|tạm biệt|👋
请|qǐng|mời; xin, vui lòng|🤲
对不起|duì bu qǐ|xin lỗi|🙇
没关系|méi guān xi|không sao|👌
喂|wèi|alô (nghe điện thoại)|📞
# Đại từ & từ để hỏi
我|wǒ|tôi, mình|🙋
你|nǐ|bạn, anh, chị|👉
他|tā|anh ấy, ông ấy|👨
她|tā|cô ấy, bà ấy|👩
我们|wǒ men|chúng tôi, chúng ta|👨‍👩‍👧
这|zhè|đây, này|👇
那|nà|kia, đó; vậy thì|👉
哪|nǎ|nào|❓
哪儿|nǎr|ở đâu|📍
谁|shéi|ai|🕵️
什么|shén me|cái gì|❓
多少|duō shao|bao nhiêu|🔢
几|jǐ|mấy (thường dưới 10)|✋
怎么|zěn me|thế nào, sao|🤔
怎么样|zěn me yàng|như thế nào|🤔
# Số đếm & lượng từ
零|líng|số không|0️⃣
一|yī|một|1️⃣
二|èr|hai|2️⃣
三|sān|ba|3️⃣
四|sì|bốn|4️⃣
五|wǔ|năm|5️⃣
六|liù|sáu|6️⃣
七|qī|bảy|7️⃣
八|bā|tám|8️⃣

 ['B','四十元。这些鱼是今天早上坐船送来的。','Sì shí yuán. Zhè xiē yú shì jīn tiān zǎo shang zuò chuán sòng lái de.','Bốn mươi tệ. Chỗ cá này sáng nay được chở bằng thuyền đến.'],

 tip:'打八折 = giảm 20% (trả 80%). 不管…都… = bất kể… đều…. 顺便 = tiện thể.',
 extra:[['光临','guāng lín','ghé thăm (lịch sự)',0],['输入','shū rù','nhập',0],['积分','jī fēn','điểm tích lũy',0]],
 lines:[
 ['A','欢迎光临！今天所有食品都打八折。','Huān yíng guāng lín! Jīn tiān suǒ yǒu shí pǐn dōu dǎ bā zhé.','Chào mừng quý khách! Hôm nay tất cả thực phẩm đều giảm 20%.'],
 ['B','太好了！这种巧克力质量怎么样？','Tài hǎo le! Zhè zhǒng qiǎo kè lì zhì liàng zěn me yàng?','Tuyệt quá! Loại sô-cô-la này chất lượng thế nào?'],
 ['A','质量很好，很多顾客都买，不管大人还是儿童都喜欢。','Zhì liàng hěn hǎo, hěn duō gù kè dōu mǎi, bù guǎn dà rén hái shi ér tóng dōu xǐ huan.','Chất lượng rất tốt, nhiều khách mua lắm, bất kể người lớn hay trẻ em đều thích.'],
 ['B','那我买两盒。我顺便看看饮料。','Nà wǒ mǎi liǎng hé. Wǒ shùn biàn kàn kan yǐn liào.','Vậy tôi mua hai hộp. Tiện thể tôi xem đồ uống.'],
 ['A','您需要塑料袋吗？一个五毛钱。','Nín xū yào sù liào dài ma? Yí ge wǔ máo qián.','Quý khách có cần túi ni lông không? Năm hào một cái.'],
 ['B','不用了，我带了包。可以用信用卡吗？','Bú yòng le, wǒ dài le bāo. Kě yǐ yòng xìn yòng kǎ ma?','Không cần, tôi mang túi rồi. Dùng thẻ tín dụng được không?'],
 ['A','可以。请输入密码。这是您的小票，请收好。','Kě yǐ. Qǐng shū rù mì mǎ. Zhè shì nín de xiǎo piào, qǐng shōu hǎo.','Được ạ. Mời nhập mật khẩu. Đây là hóa đơn của quý khách, xin giữ kỹ.'],
]},
{id:46, lv:4, icon:'🏋️', title:'Giảm cân, giữ sức khỏe', zh:'减肥', zpy:'jiǎn féi', who:{A:'Hoa',B:'Lan'},
 scene:'Hai người bạn nói chuyện về giảm cân và áp lực công việc.',
 tip:'养成…的习惯 = tạo thói quen…. 即使…也… = cho dù… cũng…. 越来越 = ngày càng.',
 extra:[['熬夜','áo yè','thức khuya',0],['根本','gēn běn','hoàn toàn, căn bản',5],['健身房','jiàn shēn fáng','phòng tập gym',0]],
 lines:[
 ['A','你最近怎么越来越瘦了？有什么好方法？','Nǐ zuì jìn zěn me yuè lái yuè shòu le? Yǒu shén me hǎo fāng fǎ?','Dạo này sao cậu ngày càng gầy thế? Có cách gì hay không?'],
 ['B','我在减肥。每天坚持去健身房，晚饭也吃得很少。','Wǒ zài jiǎn féi. Měi tiān jiān chí qù jiàn shēn fáng, wǎn fàn yě chī de hěn shǎo.','Mình đang giảm cân. Ngày nào cũng kiên trì đi tập gym, bữa tối cũng ăn rất ít.'],
 ['A','我工作压力太大，经常加班，根本没时间锻炼。','Wǒ gōng zuò yā lì tài dà, jīng cháng jiā bān, gēn běn méi shí jiān duàn liàn.','Áp lực công việc của mình quá lớn, thường xuyên tăng ca, hoàn toàn không có thời gian tập.'],
 ['B','即使再忙，也要养成锻炼的习惯。身体是最重要的。','Jí shǐ zài máng, yě yào yǎng chéng duàn liàn de xí guàn. Shēn tǐ shì zuì zhòng yào de.','Cho dù bận đến mấy cũng phải tạo thói quen tập luyện. Sức khỏe là quan trọng nhất.'],
 ['A','你说得对。我最近还经常咳嗽，皮肤也不好。','Nǐ shuō de duì. Wǒ zuì jìn hái jīng cháng ké sou, pí fū yě bù hǎo.','Cậu nói đúng. Dạo này mình còn hay ho, da cũng không tốt.'],
 ['B','你应该少熬夜，多喝水，千万别抽烟。','Nǐ yīng gāi shǎo áo yè, duō hē shuǐ, qiān wàn bié chōu yān.','Cậu nên bớt thức khuya, uống nhiều nước, tuyệt đối đừng hút thuốc.'],
 ['A','好，从明天开始，你陪我去健身房吧！','Hǎo, cóng míng tiān kāi shǐ, nǐ péi wǒ qù jiàn shēn fáng ba!','Được, bắt đầu từ mai, cậu đi tập gym cùng mình nhé!'],
]},
{id:47, lv:4, icon:'🙏', title:'Hiểu lầm và xin lỗi', zh:'误会', zpy:'wù huì', who:{A:'Minh',B:'Hùng'},
 scene:'Giải thích một hiểu lầm giữa hai người bạn thân.',
 tip:'并不是 = hoàn toàn không phải. 原来 = hóa ra. 不是…而是… = không phải… mà là….',
 extra:[['聚会','jù huì','buổi tiệc, họp mặt',0]],
 lines:[
 ['A','你昨天为什么没来参加我的生日聚会？我等了你很久。','Nǐ zuó tiān wèi shén me méi lái cān jiā wǒ de shēng rì jù huì? Wǒ děng le nǐ hěn jiǔ.','Hôm qua sao cậu không đến dự tiệc sinh nhật mình? Mình đợi cậu lâu lắm.'],
 ['B','真抱歉！这是一个误会。我并不是故意不来的。','Zhēn bào qiàn! Zhè shì yí ge wù huì. Wǒ bìng bú shì gù yì bù lái de.','Thật xin lỗi! Đây là một sự hiểu lầm. Mình hoàn toàn không cố ý không đến.'],
 ['A','那是怎么回事？你也没给我打电话。','Nà shì zěn me huí shì? Nǐ yě méi gěi wǒ dǎ diàn huà.','Vậy là chuyện gì? Cậu cũng không gọi điện cho mình.'],
 ['B','我的手机丢了，我又不记得你的号码，所以没办法联系你。','Wǒ de shǒu jī diū le, wǒ yòu bú jì de nǐ de hào mǎ, suǒ yǐ méi bàn fǎ lián xì nǐ.','Điện thoại mình bị mất, mình lại không nhớ số của cậu nên không có cách nào liên lạc.'],
 ['A','原来是这样！我还以为你生我的气了。','Yuán lái shì zhè yàng! Wǒ hái yǐ wéi nǐ shēng wǒ de qì le.','Hóa ra là vậy! Mình còn tưởng cậu giận mình.'],
 ['B','怎么会呢？我们的友谊比什么都重要。请你原谅我。','Zěn me huì ne? Wǒ men de yǒu yì bǐ shén me dōu zhòng yào. Qǐng nǐ yuán liàng wǒ.','Sao thế được? Tình bạn của chúng ta quan trọng hơn mọi thứ. Mong cậu tha lỗi cho mình.'],
 ['A','没关系，我理解。今天我请客，咱们去吃饭吧！','Méi guān xi, wǒ lǐ jiě. Jīn tiān wǒ qǐng kè, zán men qù chī fàn ba!','Không sao, mình hiểu mà. Hôm nay mình khao, chúng ta đi ăn đi!'],
]},
{id:48, lv:4, icon:'🎓', title:'Dự định du học', zh:'留学', zpy:'liú xué', who:{A:'Con',B:'Bố'},
 scene:'Con trao đổi với bố về dự định đi du học.',
 tip:'打算 = dự định. 无论…都… = bất luận… đều…. 只要…就… = chỉ cần… là….',
 extra:[['实现','shí xiàn','thực hiện',5],['费用','fèi yòng','chi phí',5],['奖学金','jiǎng xué jīn','học bổng',0]],
 lines:[
 ['A','爸爸，我毕业以后打算去中国留学，读研究生。','Bà ba, wǒ bì yè yǐ hòu dǎ suàn qù Zhōng guó liú xué, dú yán jiū shēng.','Bố ơi, con dự định sau khi tốt nghiệp sẽ sang Trung Quốc du học, học cao học.'],
 ['B','你想读什么专业？','Nǐ xiǎng dú shén me zhuān yè?','Con muốn học chuyên ngành gì?'],
 ['A','我对经济很感兴趣，将来想做国际贸易。','Wǒ duì jīng jì hěn gǎn xìng qù, jiāng lái xiǎng zuò guó jì mào yì.','Con rất hứng thú với kinh tế, tương lai muốn làm thương mại quốc tế.'],
 ['B','留学的费用很高，你考虑过吗？','Liú xué de fèi yòng hěn gāo, nǐ kǎo lǜ guo ma?','Chi phí du học rất cao, con đã cân nhắc chưa?'],
 ['A','我已经在申请奖学金了。只要我的汉语水平合格，就有机会。','Wǒ yǐ jīng zài shēn qǐng jiǎng xué jīn le. Zhǐ yào wǒ de Hàn yǔ shuǐ píng hé gé, jiù yǒu jī huì.','Con đang xin học bổng rồi. Chỉ cần trình độ tiếng Trung của con đạt chuẩn là có cơ hội.'],
 ['B','好孩子！无论你做什么决定，我和你母亲都支持你。','Hǎo hái zi! Wú lùn nǐ zuò shén me jué dìng, wǒ hé nǐ mǔ qīn dōu zhī chí nǐ.','Con ngoan! Bất luận con quyết định gì, bố và mẹ đều ủng hộ con.'],
 ['A','谢谢爸爸的鼓励！我一定会努力，实现我的理想。','Xiè xie bà ba de gǔ lì! Wǒ yí dìng huì nǔ lì, shí xiàn wǒ de lǐ xiǎng.','Cảm ơn bố đã động viên! Con nhất định sẽ cố gắng, thực hiện ước mơ của mình.'],
]},
{id:49, lv:4, icon:'🗂️', title:'Thảo luận nhóm', zh:'讨论', zpy:'tǎo lùn', who:{A:'Trưởng nhóm',B:'Đồng nghiệp'},
 scene:'Cả nhóm thảo luận kế hoạch quảng cáo sản phẩm mới.',
 tip:'对…有什么看法？ = có quan điểm gì về…? 首先…其次…最后… = trước hết… tiếp theo… cuối cùng…. 因此 = vì vậy.',
 extra:[['产品','chǎn pǐn','sản phẩm',5],['年轻人','nián qīng rén','người trẻ',0]],
 lines:[
 ['A','今天我们讨论一下新产品的广告计划，大家有什么看法？','Jīn tiān wǒ men tǎo lùn yí xià xīn chǎn pǐn de guǎng gào jì huà, dà jiā yǒu shén me kàn fǎ?','Hôm nay chúng ta thảo luận kế hoạch quảng cáo sản phẩm mới, mọi người có ý kiến gì?'],
 ['B','我觉得应该在网站上做广告，现在的年轻人都喜欢上网。','Wǒ jué de yīng gāi zài wǎng zhàn shang zuò guǎng gào, xiàn zài de nián qīng rén dōu xǐ huan shàng wǎng.','Tôi nghĩ nên quảng cáo trên mạng, giới trẻ bây giờ đều thích lên mạng.'],
 ['A','这个主意不错。还有别的意见吗？有没有人反对？','Zhè ge zhǔ yi bú cuò. Hái yǒu bié de yì jiàn ma? Yǒu méi yǒu rén fǎn duì?','Ý này hay đấy. Còn ý kiến khác không? Có ai phản đối không?'],
 ['B','我同意，不过我们也要调查一下顾客的需要。','Wǒ tóng yì, bú guò wǒ men yě yào diào chá yí xià gù kè de xū yào.','Tôi đồng ý, có điều chúng ta cũng cần điều tra nhu cầu của khách hàng.'],
 ['A','好。首先，小王负责调查；其次，小李准备广告内容。','Hǎo. Shǒu xiān, Xiǎo Wáng fù zé diào chá; qí cì, Xiǎo Lǐ zhǔn bèi guǎng gào nèi róng.','Được. Trước hết, Tiểu Vương phụ trách điều tra; tiếp theo, Tiểu Lý chuẩn bị nội dung quảng cáo.'],
 ['B','这个任务时间比较紧，我们会提前完成。','Zhè ge rèn wu shí jiān bǐ jiào jǐn, wǒ men huì tí qián wán chéng.','Nhiệm vụ này thời gian khá gấp, chúng tôi sẽ hoàn thành sớm.'],
 ['A','很好。最后，下周五我们一起总结一下效果。','Hěn hǎo. Zuì hòu, xià zhōu wǔ wǒ men yì qǐ zǒng jié yí xià xiào guǒ.','Rất tốt. Cuối cùng, thứ Sáu tuần sau chúng ta cùng tổng kết hiệu quả.'],
]},
{id:50, lv:4, icon:'🚓', title:'Va chạm giao thông', zh:'交通事故', zpy:'jiāo tōng shì gù', who:{A:'Cảnh sát',B:'Tài xế'},
 scene:'Hai xe va chạm nhẹ trên đường, cảnh sát đến xử lý.',
 tip:'被 + người + động từ = bị ai làm gì: 被后面的车撞了. 速度太快 = tốc độ quá nhanh. 幸亏 = may mà.',
 extra:[['遵守','zūn shǒu','tuân thủ',5],['事故','shì gù','tai nạn, sự cố',5],['驾照','jià zhào','bằng lái xe',0],['幸亏','xìng kuī','may mà',5],['受伤','shòu shāng','bị thương',5]],
 lines:[
 ['A','你好，我是警察。发生了什么事？','Nǐ hǎo, wǒ shì jǐng chá. Fā shēng le shén me shì?','Chào anh, tôi là cảnh sát. Đã xảy ra chuyện gì?'],
 ['B','我的车停在路口等红灯，突然被后面的车撞了。','Wǒ de chē tíng zài lù kǒu děng hóng dēng, tū rán bèi hòu miàn de chē zhuàng le.','Xe tôi đang dừng ở ngã tư chờ đèn đỏ, bỗng nhiên bị xe phía sau đâm vào.'],
 ['A','有人受伤吗？','Yǒu rén shòu shāng ma?','Có ai bị thương không?'],
 ['B','幸亏没有人受伤，只是车坏了一点儿。','Xìng kuī méi yǒu rén shòu shāng, zhǐ shì chē huài le yì diǎnr.','May mà không ai bị thương, chỉ là xe hỏng một chút.'],
 ['A','请把你的驾照给我看一下。后面那辆车的速度太快了，很危险。','Qǐng bǎ nǐ de jià zhào gěi wǒ kàn yí xià. Hòu miàn nà liàng chē de sù dù tài kuài le, hěn wēi xiǎn.','Cho tôi xem bằng lái của anh. Chiếc xe phía sau chạy quá nhanh, rất nguy hiểm.'],
 ['B','好的。这条路上经常堵车，大家都很着急。','Hǎo de. Zhè tiáo lù shang jīng cháng dǔ chē, dà jiā dōu hěn zháo jí.','Vâng. Đường này hay tắc, ai cũng sốt ruột.'],
 ['A','开车一定要遵守交通规定，安全第一。','Kāi chē yí dìng yào zūn shǒu jiāo tōng guī dìng, ān quán dì yī.','Lái xe nhất định phải tuân thủ quy định giao thông, an toàn là trên hết.'],
]},
{id:51, lv:4, icon:'🥟', title:'Cùng nhau gói bánh chẻo', zh:'包饺子', zpy:'bāo jiǎo zi', who:{A:'Mẹ',B:'Con gái'},
 scene:'Mẹ dạy con gói bánh chẻo và nấu canh.',
 tip:'尝尝 = nếm thử. 有点儿 + tính từ (ý chưa vừa): 有点儿咸 = hơi mặn. 原来 = hóa ra.',
 extra:[['辣椒','là jiāo','ớt',5],['包','bāo','gói',0],['肉','ròu','thịt',0],['醋','cù','giấm',0]],
 lines:[
 ['A','来，妈妈教你包饺子。先把肉和菜放在一起。','Lái, mā ma jiāo nǐ bāo jiǎo zi. Xiān bǎ ròu hé cài fàng zài yì qǐ.','Lại đây, mẹ dạy con gói bánh chẻo. Trước tiên cho thịt và rau vào cùng nhau.'],
 ['B','要放多少盐？','Yào fàng duō shao yán?','Phải cho bao nhiêu muối ạ?'],
 ['A','稍微放一点儿就行，太咸了不好吃。','Shāo wēi fàng yì diǎnr jiù xíng, tài xián le bù hǎo chī.','Cho một chút là được, mặn quá không ngon.'],
 ['B','妈妈，你包的饺子又快又整齐，我的样子好奇怪！','Mā ma, nǐ bāo de jiǎo zi yòu kuài yòu zhěng qí, wǒ de yàng zi hǎo qí guài!','Mẹ ơi, bánh mẹ gói vừa nhanh vừa đều, cái của con trông kỳ quá!'],
 ['A','没关系，多练习就好了。你再尝尝这个西红柿汤。','Méi guān xi, duō liàn xí jiù hǎo le. Nǐ zài cháng chang zhè ge xī hóng shì tāng.','Không sao, luyện nhiều là được. Con nếm thử canh cà chua này xem.'],
 ['B','好香啊！有点儿酸，也有点儿甜，味道真好。','Hǎo xiāng a! Yǒu diǎnr suān, yě yǒu diǎnr tián, wèi dao zhēn hǎo.','Thơm quá! Hơi chua, cũng hơi ngọt, vị ngon thật.'],
 ['A','饺子好了，你喜欢辣的，可以加一点儿醋和辣椒。','Jiǎo zi hǎo le, nǐ xǐ huan là de, kě yǐ jiā yì diǎnr cù hé là jiāo.','Bánh chín rồi, con thích cay thì cho thêm chút giấm và ớt.'],
]},
{id:52, lv:4, icon:'🌏', title:'Bảo vệ môi trường', zh:'保护环境', zpy:'bǎo hù huán jìng', who:{A:'Phóng viên',B:'Giáo sư'},
 scene:'Phóng viên phỏng vấn giáo sư về ô nhiễm không khí và khí hậu.',
 tip:'随着 = cùng với: 随着经济发展. 引起 = gây ra. 从…做起 = bắt đầu làm từ….',
 extra:[['工厂','gōng chǎng','nhà máy',5],['垃圾','lā jī','rác',4]],
 lines:[

 ['A','不用。根据检查结果，我的诊断是消化不良，跟心理因素也有关系。','Bú yòng. Gēn jù jiǎn chá jié guǒ, wǒ de zhěn duàn shì xiāo huà bù liáng, gēn xīn lǐ yīn sù yě yǒu guān xi.','Không cần. Căn cứ kết quả khám, tôi chẩn đoán là khó tiêu, cũng liên quan đến yếu tố tâm lý.'],
 ['A','我给你开点儿药。饮食要清淡，少吃油炸的食物，注意营养，按时睡觉。','Wǒ gěi nǐ kāi diǎnr yào. Yǐn shí yào qīng dàn, shǎo chī yóu zhá de shí wù, zhù yì yíng yǎng, àn shí shuì jiào.','Tôi kê ít thuốc cho anh. Ăn uống phải thanh đạm, ít ăn đồ chiên, chú ý dinh dưỡng, ngủ đúng giờ.'],
 ['B','谢谢大夫，我一定好好放松，遵守您的要求。','Xiè xie dài fu, wǒ yí dìng hǎo hǎo fàng sōng, zūn shǒu nín de yāo qiú.','Cảm ơn bác sĩ, tôi nhất định sẽ thư giãn và làm theo yêu cầu của bác sĩ.'],
]},
{id:57, lv:5, icon:'🏫', title:'Họp phụ huynh', zh:'家长会', zpy:'jiā zhǎng huì', who:{A:'Giáo viên chủ nhiệm',B:'Phụ huynh'},
 scene:'Mẹ của Tiểu Minh gặp cô giáo chủ nhiệm để hỏi tình hình học tập của con.',
 tip:'就是… = chỉ có điều…. A不如B = A không bằng B. 好好 + động từ = làm cho tử tế.',
 extra:[['家长','jiā zhǎng','phụ huynh',0]],
 lines:[
 ['A','您好，您是小明的妈妈吧？请坐。','Nín hǎo, nín shì Xiǎo Míng de mā ma ba? Qǐng zuò.','Chào chị, chị là mẹ của Tiểu Minh phải không? Mời ngồi.'],
 ['B','是的，老师。孩子最近在学校表现怎么样？','Shì de, lǎo shī. Hái zi zuì jìn zài xué xiào biǎo xiàn zěn me yàng?','Vâng, thưa cô. Dạo này cháu ở trường thế nào ạ?'],
 ['A','他很聪明，也很活跃，就是有点儿调皮，上课不够专心。','Tā hěn cōng ming, yě hěn huó yuè, jiù shì yǒu diǎnr tiáo pí, shàng kè bú gòu zhuān xīn.','Cháu rất thông minh, cũng rất sôi nổi, chỉ có điều hơi nghịch, trong giờ học chưa đủ tập trung.'],
 ['B','真不好意思。他在家也总是玩儿手机，我说他，他也不听。','Zhēn bù hǎo yì si. Tā zài jiā yě zǒng shì wánr shǒu jī, wǒ shuō tā, tā yě bù tīng.','Thật ngại quá. Ở nhà cháu cũng toàn chơi điện thoại, tôi nói cháu cũng không nghe.'],
 ['A','别着急。批评孩子不如鼓励他，要多跟他沟通。','Bié zháo jí. Pī píng hái zi bù rú gǔ lì tā, yào duō gēn tā gōu tōng.','Chị đừng sốt ruột. Phê bình con không bằng động viên con, phải trò chuyện với con nhiều hơn.'],
 ['B','那我应该怎么培养他的学习习惯呢？','Nà wǒ yīng gāi zěn me péi yǎng tā de xué xí xí guàn ne?','Vậy tôi nên rèn thói quen học tập cho cháu thế nào?'],
 ['A','可以和他一起制定日程，每天固定时间做作业，完成以后再娱乐。','Kě yǐ hé tā yì qǐ zhì dìng rì chéng, měi tiān gù dìng shí jiān zuò zuò yè, wán chéng yǐ hòu zài yú lè.','Có thể cùng cháu lập thời gian biểu, mỗi ngày làm bài tập vào giờ cố định, xong rồi mới chơi.'],
 ['A','其实他的作文写得很生动，这学期进步很大。','Qí shí tā de zuò wén xiě de hěn shēng dòng, zhè xué qī jìn bù hěn dà.','Thật ra bài văn của cháu viết rất sinh động, học kỳ này tiến bộ nhiều.'],
 ['B','太感谢您了！我们家长一定好好配合。','Tài gǎn xiè nín le! Wǒ men jiā zhǎng yí dìng hǎo hǎo pèi hé.','Cảm ơn cô nhiều! Phụ huynh chúng tôi nhất định sẽ phối hợp tốt.'],
]},
{id:58, lv:5, icon:'📦', title:'Mua hàng online và trả hàng', zh:'网购退货', zpy:'wǎng gòu tuì huò', who:{A:'Nhân viên CSKH',B:'Khách hàng'},
 scene:'Khách gọi tổng đài vì áo mua online khác màu và chất lượng kém.',
 tip:'一…就… = hễ… là…: 一洗就掉颜色. 由…承担 = do… chịu. A还是B？ = A hay B?',
 extra:[['客服','kè fú','chăm sóc khách hàng',0],['外套','wài tào','áo khoác',0],['图片','tú piàn','hình ảnh',0],['订单','dìng dān','đơn hàng',0],['退货','tuì huò','trả hàng',0],['运费','yùn fèi','phí vận chuyển',0],['快递员','kuài dì yuán','nhân viên giao hàng',0],['上门','shàng mén','đến tận nhà',0]],
 lines:[
 ['A','您好，这里是客服中心，请问有什么可以帮您？','Nín hǎo, zhè lǐ shì kè fú zhōng xīn, qǐng wèn yǒu shén me kě yǐ bāng nín?','Xin chào, đây là trung tâm chăm sóc khách hàng, tôi có thể giúp gì cho chị?'],
 ['B','我上周在网上买了一件外套，收到的包裹里颜色跟图片完全不一样。','Wǒ shàng zhōu zài wǎng shang mǎi le yí jiàn wài tào, shōu dào de bāo guǒ li yán sè gēn tú piàn wán quán bù yí yàng.','Tuần trước tôi mua một chiếc áo khoác trên mạng, màu trong bưu kiện nhận được hoàn toàn khác ảnh.'],
 ['A','非常抱歉！您能把订单号码和照片发给我们确认一下吗？','Fēi cháng bào qiàn! Nín néng bǎ dìng dān hào mǎ hé zhào piàn fā gěi wǒ men què rèn yí xià ma?','Thành thật xin lỗi! Chị có thể gửi mã đơn hàng và ảnh để chúng tôi xác nhận không?'],
 ['B','已经发了。而且衣服的质量也很差，一洗就掉颜色。','Yǐ jīng fā le. Ér qiě yī fu de zhì liàng yě hěn chà, yì xǐ jiù diào yán sè.','Gửi rồi. Hơn nữa chất lượng áo cũng rất kém, vừa giặt đã phai màu.'],
 ['A','我们看了，的确是我们的错误。您想退货还是换一件？','Wǒ men kàn le, dí què shì wǒ men de cuò wù. Nín xiǎng tuì huò hái shi huàn yí jiàn?','Chúng tôi xem rồi, quả thật là lỗi của chúng tôi. Chị muốn trả hàng hay đổi chiếc khác?'],
 ['B','退货吧。运费谁来出？','Tuì huò ba. Yùn fèi shéi lái chū?','Trả hàng đi. Phí vận chuyển ai trả?'],
 ['A','运费由我们承担。快递员明天会上门取货，钱三天内退回您的账户。','Yùn fèi yóu wǒ men chéng dān. Kuài dì yuán míng tiān huì shàng mén qǔ huò, qián sān tiān nèi tuì huí nín de zhàng hù.','Phí vận chuyển do chúng tôi chịu. Mai nhân viên giao hàng sẽ đến tận nhà lấy hàng, tiền hoàn về tài khoản chị trong ba ngày.'],
 ['B','好的。希望你们以后改进服务，别再让顾客失望了。','Hǎo de. Xī wàng nǐ men yǐ hòu gǎi jìn fú wù, bié zài ràng gù kè shī wàng le.','Được. Mong các bạn sau này cải tiến dịch vụ, đừng để khách thất vọng nữa.'],
 ['A','谢谢您的意见，我们一定会改正。祝您生活愉快！','Xiè xie nín de yì jiàn, wǒ men yí dìng huì gǎi zhèng. Zhù nín shēng huó yú kuài!','Cảm ơn ý kiến của chị, chúng tôi nhất định sẽ sửa. Chúc chị cuộc sống vui vẻ!'],
]},
{id:59, lv:5, icon:'🛕', title:'Tham quan danh thắng', zh:'游览名胜', zpy:'yóu lǎn míng shèng', who:{A:'Hướng dẫn viên',B:'Du khách'},
 scene:'Đoàn du lịch tham quan một ngôi chùa cổ nghìn năm tuổi.',
 tip:'据说 = nghe nói. 曾经 = đã từng. 舍不得 + động từ = không nỡ….',
 extra:[['宋朝','Sòng cháo','nhà Tống',0],['拍照','pāi zhào','chụp ảnh',0],['集合','jí hé','tập trung',0],['一草一木','yì cǎo yí mù','từng ngọn cỏ cành cây',0]],
 lines:[
 ['A','大家好！今天我们游览的是一座有一千多年历史的寺庙。','Dà jiā hǎo! Jīn tiān wǒ men yóu lǎn de shì yí zuò yǒu yì qiān duō nián lì shǐ de sì miào.','Chào mọi người! Hôm nay chúng ta tham quan một ngôi chùa có lịch sử hơn một nghìn năm.'],
 ['B','这座塔真雄伟！它是哪个朝代建的？','Zhè zuò tǎ zhēn xióng wěi! Tā shì nǎ ge cháo dài jiàn de?','Ngọn tháp này thật hùng vĩ! Nó được xây vào triều đại nào?'],
 ['A','是宋朝建的。据说当时的皇帝曾经亲自来过这里。','Shì Sòng cháo jiàn de. Jù shuō dāng shí de huáng dì céng jīng qīn zì lái guo zhè lǐ.','Được xây vào thời Tống. Nghe nói hoàng đế thời đó từng đích thân đến đây.'],
 ['B','塔上的这些字是什么意思？','Tǎ shang de zhè xiē zì shì shén me yì si?','Những chữ trên tháp này nghĩa là gì?'],
 ['A','这是一首古典诗，描写的是这里的美丽景色，象征和平和幸福。','Zhè shì yì shǒu gǔ diǎn shī, miáo xiě de shì zhè lǐ de měi lì jǐng sè, xiàng zhēng hé píng hé xìng fú.','Đây là một bài thơ cổ điển, miêu tả cảnh sắc tươi đẹp nơi đây, tượng trưng cho hòa bình và hạnh phúc.'],
 ['B','可以在这里拍照吗？','Kě yǐ zài zhè lǐ pāi zhào ma?','Có thể chụp ảnh ở đây không?'],
 ['A','可以，但是里面不能拍照。请大家遵守规则，爱护这里的一草一木。','Kě yǐ, dàn shì lǐ miàn bù néng pāi zhào. Qǐng dà jiā zūn shǒu guī zé, ài hù zhè lǐ de yì cǎo yí mù.','Được, nhưng bên trong không được chụp. Mời mọi người tuân thủ quy định, giữ gìn từng ngọn cỏ cành cây nơi đây.'],
 ['B','这儿的风景太优美了，真舍不得走。','Zhèr de fēng jǐng tài yōu měi le, zhēn shě bu de zǒu.','Phong cảnh ở đây đẹp quá, thật không nỡ rời đi.'],
 ['A','我们有一个小时自由活动，十一点在门口集合。','Wǒ men yǒu yí ge xiǎo shí zì yóu huó dòng, shí yī diǎn zài mén kǒu jí hé.','Chúng ta có một tiếng tự do, mười một giờ tập trung ở cổng.'],
]},
{id:60, lv:5, icon:'🚓', title:'Tai nạn giao thông và bảo hiểm', zh:'交通事故', zpy:'jiāo tōng shì gù', who:{A:'Cảnh sát',B:'Tài xế'},
 scene:'Một chiếc xe máy va chạm với ô tô ở ngã tư, cảnh sát đến xử lý.',
 tip:'来不及 = không kịp. 幸亏 = may mà. 由…赔偿 = do… bồi thường.',
 extra:[['出示','chū shì','xuất trình',0],['路口','lù kǒu','ngã tư, giao lộ',0],['摄像头','shè xiàng tóu','camera giám sát',0],['医药费','yī yào fèi','tiền thuốc men',0],['责任','zé rèn','trách nhiệm',0]],
 lines:[
 ['A','请出示您的驾驶执照。发生了什么事？','Qǐng chū shì nín de jià shǐ zhí zhào. Fā shēng le shén me shì?','Xin xuất trình bằng lái xe. Đã xảy ra chuyện gì?'],
 ['B','我开得很慢，那辆摩托车突然从旁边冲出来，我根本来不及停车。','Wǒ kāi de hěn màn, nà liàng mó tuō chē tū rán cóng páng biān chōng chu lai, wǒ gēn běn lái bu jí tíng chē.','Tôi lái rất chậm, chiếc xe máy kia đột nhiên lao ra từ bên cạnh, tôi hoàn toàn không kịp dừng xe.'],
 ['A','有人受伤吗？','Yǒu rén shòu shāng ma?','Có ai bị thương không?'],
 ['B','骑车的小伙子摔在地上，胳膊受了点儿伤，我已经叫了救护车。','Qí chē de xiǎo huǒ zi shuāi zài dì shang, gē bo shòu le diǎnr shāng, wǒ yǐ jīng jiào le jiù hù chē.','Chàng trai đi xe ngã xuống đất, cánh tay bị thương nhẹ, tôi đã gọi xe cứu thương rồi.'],
 ['A','路口有摄像头，我们会调查清楚。你们双方先别争论。','Lù kǒu yǒu shè xiàng tóu, wǒ men huì diào chá qīng chu. Nǐ men shuāng fāng xiān bié zhēng lùn.','Ở ngã tư có camera, chúng tôi sẽ điều tra rõ. Hai bên tạm thời đừng tranh cãi.'],
 ['B','好的。幸亏我买了保险，医药费应该由保险公司赔偿吧？','Hǎo de. Xìng kuī wǒ mǎi le bǎo xiǎn, yī yào fèi yīng gāi yóu bǎo xiǎn gōng sī péi cháng ba?','Vâng. May mà tôi có mua bảo hiểm, tiền thuốc men chắc do công ty bảo hiểm bồi thường nhỉ?'],
 ['A','要看责任是谁的。如果是对方违反交通规则，你就不用承担责任。','Yào kàn zé rèn shì shéi de. Rú guǒ shì duì fāng wéi fǎn jiāo tōng guī zé, nǐ jiù bú yòng chéng dān zé rèn.','Còn tùy lỗi của ai. Nếu bên kia vi phạm luật giao thông thì anh không phải chịu trách nhiệm.'],
 ['B','明白了。我得给保险公司打个电话，让他们派人过来。','Míng bai le. Wǒ děi gěi bǎo xiǎn gōng sī dǎ ge diàn huà, ràng tā men pài rén guò lai.','Tôi hiểu rồi. Tôi phải gọi cho công ty bảo hiểm để họ cử người đến.'],
 ['A','以后开车一定要谨慎，安全第一。','Yǐ hòu kāi chē yí dìng yào jǐn shèn, ān quán dì yī.','Sau này lái xe nhất định phải thận trọng, an toàn là trên hết.'],
]},
{id:61, lv:5, icon:'📝', title:'Xin nghỉ việc', zh:'辞职', zpy:'cí zhí', who:{A:'Nhân viên',B:'Trưởng phòng'},
 scene:'Nhân viên nộp đơn xin nghỉ việc và trao đổi với trưởng phòng.',
 tip:'是…还是…？ = là… hay…? 既然…就… = đã… thì…. 提前 = trước (thời hạn).',
 extra:[['心事','xīn shì','tâm sự, nỗi lo',0],['交接','jiāo jiē','bàn giao',0],['客户','kè hù','khách hàng',0]],
 lines:[
 ['A','经理，您现在有空吗？我想跟您谈一件事。','Jīng lǐ, nín xiàn zài yǒu kòng ma? Wǒ xiǎng gēn nín tán yí jiàn shì.','Trưởng phòng, bây giờ anh có rảnh không? Em muốn nói với anh một chuyện.'],
 ['B','当然，坐吧。看你的表情，好像有心事。','Dāng rán, zuò ba. Kàn nǐ de biǎo qíng, hǎo xiàng yǒu xīn shì.','Tất nhiên, ngồi đi. Nhìn nét mặt em, hình như có tâm sự.'],
 ['A','我考虑了很久，决定辞职。这是我的辞职信。','Wǒ kǎo lǜ le hěn jiǔ, jué dìng cí zhí. Zhè shì wǒ de cí zhí xìn.','Em suy nghĩ rất lâu rồi, quyết định nghỉ việc. Đây là đơn xin nghỉ của em.'],
 ['B','太意外了！是对待遇不满意，还是跟同事相处得不好？','Tài yì wài le! Shì duì dài yù bù mǎn yì, hái shi gēn tóng shì xiāng chǔ de bù hǎo?','Bất ngờ quá! Em không hài lòng về đãi ngộ, hay là không hòa hợp với đồng nghiệp?'],
 ['A','都不是。我在这儿学到了很多，非常感激您。只是我想换个领域，挑战一下自己。','Dōu bú shì. Wǒ zài zhèr xué dào le hěn duō, fēi cháng gǎn jī nín. Zhǐ shì wǒ xiǎng huàn ge lǐng yù, tiǎo zhàn yí xià zì jǐ.','Đều không phải. Em học được rất nhiều ở đây, rất biết ơn anh. Chỉ là em muốn đổi lĩnh vực, thử thách bản thân.'],
 ['B','真舍不得你走。不过既然你已经决定了，我尊重你的选择。','Zhēn shě bu de nǐ zǒu. Bú guò jì rán nǐ yǐ jīng jué dìng le, wǒ zūn zhòng nǐ de xuǎn zé.','Thật không nỡ để em đi. Nhưng em đã quyết định rồi thì anh tôn trọng lựa chọn của em.'],
 ['B','按照公司的制度，你需要提前一个月提出，把手上的工作交接好。','Àn zhào gōng sī de zhì dù, nǐ xū yào tí qián yí ge yuè tí chū, bǎ shǒu shang de gōng zuò jiāo jiē hǎo.','Theo quy chế công ty, em cần báo trước một tháng và bàn giao xong công việc đang làm.'],
 ['A','没问题，我会把所有资料整理好，再转告客户。','Méi wèn tí, wǒ huì bǎ suǒ yǒu zī liào zhěng lǐ hǎo, zài zhuǎn gào kè hù.','Không vấn đề, em sẽ sắp xếp xong toàn bộ tài liệu rồi báo lại cho khách hàng.'],
 ['B','祝你前途光明！以后常联系。','Zhù nǐ qián tú guāng míng! Yǐ hòu cháng lián xì.','Chúc em tương lai tươi sáng! Sau này giữ liên lạc nhé.'],

{id:62, lv:5, icon:'🧧', title:'Đón Tết Nguyên đán', zh:'过春节', zpy:'guò Chūn jié', who:{A:'Lý Na (Trung Quốc)',B:'Lan (Việt Nam)'},

 lines:[

 ['A','去亲戚家拜年，互相问候，祝福对方新年快乐、万事如意。','Qù qīn qi jiā bài nián, hù xiāng wèn hòu, zhù fú duì fāng xīn nián kuài lè, wàn shì rú yì.','Đến nhà họ hàng chúc Tết, hỏi thăm nhau, chúc nhau năm mới vui vẻ, vạn sự như ý.'],

 lines:[

 ['A','好了，能开机了。是一个软件跟系统有冲突，我已经把它删除了。','Hǎo le, néng kāi jī le. Shì yí ge ruǎn jiàn gēn xì tǒng yǒu chōng tū, wǒ yǐ jīng bǎ tā shān chú le.','Xong rồi, khởi động được rồi. Là một phần mềm xung đột với hệ thống, em đã xóa nó đi.'],

 ['A','您好，请您简要介绍一下这款新手机的特色。','Nín hǎo, qǐng nín jiǎn yào jiè shào yí xià zhè kuǎn xīn shǒu jī de tè sè.','Xin chào, mời anh giới thiệu ngắn gọn điểm đặc sắc của chiếc điện thoại mới này.'],
 ['B','这款手机最大的突破是电池，充电十分钟就能用一整天。','Zhè kuǎn shǒu jī zuì dà de tū pò shì diàn chí, chōng diàn shí fēn zhōng jiù néng yòng yì zhěng tiān.','Đột phá lớn nhất của máy là pin, sạc mười phút là dùng được cả ngày.'],
 ['A','听说你们在研发上投入了大量资金，成本会不会太高？','Tīng shuō nǐ men zài yán fā shang tóu rù le dà liàng zī jīn, chéng běn huì bu huì tài gāo?','Nghe nói các anh đầu tư lượng vốn lớn vào nghiên cứu, giá thành có quá cao không?'],
 ['B','确实如此。不过我们优化了供应链，价格依然很实惠。','Què shí rú cǐ. Bú guò wǒ men yōu huà le gōng yìng liàn, jià gé yī rán hěn shí huì.','Quả đúng vậy. Nhưng chúng tôi đã tối ưu chuỗi cung ứng, giá vẫn rất phải chăng.'],
 ['A','市场上竞争这么激烈，你们有什么战略？','Shì chǎng shang jìng zhēng zhè me jī liè, nǐ men yǒu shén me zhàn lüè?','Thị trường cạnh tranh gay gắt như vậy, các anh có chiến lược gì?'],
 ['B','我们注重用户的需求，坚持创新，力争成为行业里的一流品牌。','Wǒ men zhù zhòng yòng hù de xū qiú, jiān chí chuàng xīn, lì zhēng chéng wéi háng yè li de yì liú pǐn pái.','Chúng tôi chú trọng nhu cầu người dùng, kiên trì đổi mới, phấn đấu trở thành thương hiệu hàng đầu trong ngành.'],
 ['A','新产品什么时候上市？','Xīn chǎn pǐn shén me shí hou shàng shì?','Khi nào sản phẩm mới ra thị trường?'],
 ['B','下个月一号正式上市，届时会在各大城市同步发售。','Xià ge yuè yī hào zhèng shì shàng shì, jiè shí huì zài gè dà chéng shì tóng bù fā shòu.','Ngày mùng một tháng sau chính thức ra mắt, khi đó sẽ mở bán đồng loạt ở các thành phố lớn.'],
 ['A','谢谢您！祝发布会圆满成功。','Xiè xie nín! Zhù fā bù huì yuán mǎn chéng gōng.','Cảm ơn anh! Chúc buổi ra mắt thành công tốt đẹp.'],
]},
{id:66, lv:6, icon:'⚖️', title:'Tư vấn pháp luật: đòi nợ', zh:'法律咨询', zpy:'fǎ lǜ zī xún', who:{A:'Luật sư',B:'Chủ doanh nghiệp'},
 scene:'Khách hàng chậm thanh toán nửa năm, chủ doanh nghiệp đi hỏi luật sư.',
 tip:'关于… = về…. 只能 = chỉ có thể. 由…承担 = do… chịu.',
 extra:[['违约','wéi yuē','vi phạm hợp đồng',0],['违约金','wéi yuē jīn','tiền phạt vi phạm hợp đồng',0],['起诉','qǐ sù','khởi kiện',0],['败诉','bài sù','thua kiện',0]],
 lines:[
 ['B','律师您好，我的一个客户拖延付款已经半年了，我该怎么办？','Lǜ shī nín hǎo, wǒ de yí ge kè hù tuō yán fù kuǎn yǐ jīng bàn nián le, wǒ gāi zěn me bàn?','Chào luật sư, một khách hàng của tôi chậm thanh toán đã nửa năm, tôi nên làm gì?'],
 ['A','你们签订合同了吗？合同里有没有关于违约的条款？','Nǐ men qiān dìng hé tong le ma? Hé tong li yǒu méi yǒu guān yú wéi yuē de tiáo kuǎn?','Hai bên có ký hợp đồng không? Trong hợp đồng có điều khoản về vi phạm hợp đồng không?'],
 ['B','有。合同规定，晚付款要承担百分之五的违约金。','Yǒu. Hé tong guī dìng, wǎn fù kuǎn yào chéng dān bǎi fēn zhī wǔ de wéi yuē jīn.','Có. Hợp đồng quy định trả chậm phải chịu năm phần trăm tiền phạt.'],
 ['A','那你有充足的证据。建议你先跟对方协商，给他们一个期限。','Nà nǐ yǒu chōng zú de zhèng jù. Jiàn yì nǐ xiān gēn duì fāng xié shāng, gěi tā men yí ge qī xiàn.','Vậy anh có đủ chứng cứ. Tôi khuyên anh trước hết thương lượng với bên kia, cho họ một thời hạn.'],
 ['B','如果协商不成功呢？','Rú guǒ xié shāng bù chéng gōng ne?','Nếu thương lượng không thành thì sao?'],
 ['A','那就只能打官司了，向法院起诉，要求对方赔偿损失。','Nà jiù zhǐ néng dǎ guān si le, xiàng fǎ yuàn qǐ sù, yāo qiú duì fāng péi cháng sǔn shī.','Thì chỉ còn cách ra tòa, khởi kiện lên tòa án, yêu cầu bên kia bồi thường thiệt hại.'],
 ['B','诉讼要多长时间？费用高吗？','Sù sòng yào duō cháng shí jiān? Fèi yòng gāo ma?','Kiện tụng mất bao lâu? Chi phí có cao không?'],
 ['A','一般三到六个月。诉讼费用由败诉的一方承担，所以你不必太顾虑。','Yì bān sān dào liù ge yuè. Sù sòng fèi yòng yóu bài sù de yì fāng chéng dān, suǒ yǐ nǐ bú bì tài gù lǜ.','Thường ba đến sáu tháng. Án phí do bên thua kiện chịu, nên anh không cần quá lo.'],
 ['B','明白了，那我先把相关材料整理好，再来找您。','Míng bai le, nà wǒ xiān bǎ xiāng guān cái liào zhěng lǐ hǎo, zài lái zhǎo nín.','Tôi hiểu rồi, vậy tôi sắp xếp giấy tờ liên quan trước rồi quay lại gặp luật sư.'],
]},
{id:67, lv:6, icon:'🏆', title:'Đánh giá cuối năm và thăng chức', zh:'年终考核', zpy:'nián zhōng kǎo hé', who:{A:'Tổng giám đốc',B:'Trưởng nhóm'},
 scene:'Sếp tổng khen thành tích và đề bạt trưởng nhóm lên giám đốc kinh doanh.',
 tip:'作为… = với tư cách là…. 不辜负… = không phụ…. 再接再厉 = tiếp tục cố gắng.',
 extra:[['业绩','yè jì','thành tích kinh doanh',0],['超额','chāo é','vượt mức',0],['团队','tuán duì','đội nhóm',0],['负责人','fù zé rén','người phụ trách',0],['前辈','qián bèi','tiền bối',0],['海外','hǎi wài','nước ngoài',0],['年终','nián zhōng','cuối năm',0]],
 lines:[
 ['A','今年你们部门的业绩很突出，超额完成了指标。','Jīn nián nǐ men bù mén de yè jì hěn tū chū, chāo é wán chéng le zhǐ biāo.','Năm nay thành tích bộ phận các bạn rất nổi bật, vượt mức chỉ tiêu.'],
 ['B','这是团队齐心协力的结果，大家都很辛勤。','Zhè shì tuán duì qí xīn xié lì de jié guǒ, dà jiā dōu hěn xīn qín.','Đây là kết quả cả nhóm đồng lòng, mọi người đều rất chăm chỉ.'],
 ['A','你作为负责人，决策果断，协调能力也很强。','Nǐ zuò wéi fù zé rén, jué cè guǒ duàn, xié tiáo néng lì yě hěn qiáng.','Bạn là người phụ trách, ra quyết định quả quyết, khả năng điều phối cũng rất tốt.'],
 ['A','公司决定提拔你担任销售部经理，你有什么想法？','Gōng sī jué dìng tí bá nǐ dān rèn xiāo shòu bù jīng lǐ, nǐ yǒu shén me xiǎng fǎ?','Công ty quyết định đề bạt bạn làm giám đốc kinh doanh, bạn có suy nghĩ gì?'],
 ['B','太感谢公司的信赖了！我一定竭尽全力，不辜负大家的期望。','Tài gǎn xiè gōng sī de xìn lài le! Wǒ yí dìng jié jìn quán lì, bù gū fù dà jiā de qī wàng.','Rất cảm ơn sự tin tưởng của công ty! Tôi nhất định dốc hết sức, không phụ kỳ vọng của mọi người.'],
 ['A','新的岗位压力更大，你要处理好跟下属的关系。','Xīn de gǎng wèi yā lì gèng dà, nǐ yào chǔ lǐ hǎo gēn xià shǔ de guān xi.','Vị trí mới áp lực lớn hơn, bạn phải xử lý tốt quan hệ với cấp dưới.'],
 ['B','我会虚心向前辈请教，同时完善团队的规章制度。','Wǒ huì xū xīn xiàng qián bèi qǐng jiào, tóng shí wán shàn tuán duì de guī zhāng zhì dù.','Tôi sẽ khiêm tốn học hỏi các tiền bối, đồng thời hoàn thiện quy chế của nhóm.'],
 ['A','很好。明年的目标是开拓海外市场，任重道远啊。','Hěn hǎo. Míng nián de mù biāo shì kāi tuò hǎi wài shì chǎng, rèn zhòng dào yuǎn a.','Tốt lắm. Mục tiêu năm sau là khai phá thị trường nước ngoài, gánh nặng đường xa đấy.'],
 ['B','请您放心，我们会再接再厉！','Qǐng nín fàng xīn, wǒ men huì zài jiē zài lì!','Anh cứ yên tâm, chúng tôi sẽ tiếp tục cố gắng!'],
]},
{id:68, lv:6, icon:'👨‍👩‍👦', title:'Bàn chuyện dạy con', zh:'教育孩子', zpy:'jiào yù hái zi', who:{A:'Vợ',B:'Chồng'},
 scene:'Hai vợ chồng bàn cách giúp con bớt chơi game và học chăm hơn.',
 tip:'难道…吗？ = chẳng lẽ… sao? 以身作则 = lấy mình làm gương. A比B + adj + 得多 = A… hơn B nhiều.',
 extra:[['了事','liǎo shì','cho xong chuyện',0],['放任','fàng rèn','bỏ mặc',0],['约定','yuē dìng','giao hẹn',0],['以身作则','yǐ shēn zuò zé','lấy mình làm gương',0],['有效','yǒu xiào','hiệu quả',0]],
 lines:[
 ['A','儿子最近成天玩儿游戏，作业也敷衍了事，我真发愁。','Ér zi zuì jìn chéng tiān wánr yóu xì, zuò yè yě fū yǎn liǎo shì, wǒ zhēn fā chóu.','Dạo này con trai suốt ngày chơi game, bài tập cũng làm qua loa cho xong, em lo quá.'],
 ['B','别急着批评他。这个年龄的孩子都比较任性，逼迫只会让他反感。','Bié jí zhe pī píng tā. Zhè ge nián líng de hái zi dōu bǐ jiào rèn xìng, bī pò zhǐ huì ràng tā fǎn gǎn.','Đừng vội trách con. Trẻ tuổi này đều khá bướng, ép buộc chỉ khiến con phản cảm.'],
 ['A','那你说该怎么办？难道就放任不管吗？','Nà nǐ shuō gāi zěn me bàn? Nán dào jiù fàng rèn bù guǎn ma?','Vậy anh bảo nên làm sao? Chẳng lẽ cứ bỏ mặc không quản à?'],
 ['B','当然不是。我们可以跟他约定，每天完成作业以后才能玩儿一个小时。','Dāng rán bú shì. Wǒ men kě yǐ gēn tā yuē dìng, měi tiān wán chéng zuò yè yǐ hòu cái néng wánr yí ge xiǎo shí.','Tất nhiên không. Mình có thể giao hẹn với con, mỗi ngày làm xong bài tập mới được chơi một tiếng.'],
 ['A','他会遵守吗？','Tā huì zūn shǒu ma?','Con có chịu làm theo không?'],
 ['B','父母要以身作则。我们自己也少看手机，多陪他读书、运动。','Fù mǔ yào yǐ shēn zuò zé. Wǒ men zì jǐ yě shǎo kàn shǒu jī, duō péi tā dú shū, yùn dòng.','Bố mẹ phải làm gương. Chính mình cũng bớt xem điện thoại, đọc sách và tập thể thao cùng con nhiều hơn.'],
 ['A','有道理。其实他对天文很感兴趣，我们周末可以带他去天文馆。','Yǒu dào li. Qí shí tā duì tiān wén hěn gǎn xìng qù, wǒ men zhōu mò kě yǐ dài tā qù tiān wén guǎn.','Có lý. Thật ra con rất thích thiên văn, cuối tuần mình có thể đưa con đi cung thiên văn.'],
 ['B','好主意！培养他的兴趣，比强迫他学习有效得多。','Hǎo zhǔ yi! Péi yǎng tā de xìng qù, bǐ qiǎng pò tā xué xí yǒu xiào de duō.','Ý hay! Nuôi dưỡng sở thích của con hiệu quả hơn ép con học nhiều.'],
 ['A','看来教育孩子也需要智慧和耐心啊。','Kàn lái jiào yù hái zi yě xū yào zhì huì hé nài xīn a.','Xem ra dạy con cũng cần trí tuệ và kiên nhẫn.'],
]},
{id:69, lv:6, icon:'🍵', title:'Giữ gìn sức khỏe', zh:'养生之道', zpy:'yǎng shēng zhī dào', who:{A:'Bác sĩ',B:'Nhân viên văn phòng'},
 scene:'Người hay thức khuya, đau cổ đến hỏi bác sĩ cách dưỡng sinh.',
 tip:'长期 = lâu dài. 首先…另外… = trước hết… ngoài ra…. 贵在坚持 = quý ở sự kiên trì.',
 extra:[['熬夜','áo yè','thức khuya',0],['长期','cháng qī','lâu dài',0],['免疫力','miǎn yì lì','sức đề kháng',0],['下降','xià jiàng','giảm xuống',0],['引起','yǐn qǐ','gây ra',0],['睡眠','shuì mián','giấc ngủ',0],['养成','yǎng chéng','hình thành (thói quen)',0],['养生','yǎng shēng','dưỡng sinh',0]],
 lines:[
 ['B','大夫，我最近总是疲惫，颈椎也疼，是不是身体出了什么问题？','Dài fu, wǒ zuì jìn zǒng shì pí bèi, jǐng zhuī yě téng, shì bu shì shēn tǐ chū le shén me wèn tí?','Bác sĩ ơi, dạo này tôi luôn mệt mỏi, cổ cũng đau, có phải cơ thể có vấn đề gì không?'],
 ['A','你的气色不太好。平时作息规律吗？','Nǐ de qì sè bú tài hǎo. Píng shí zuò xī guī lǜ ma?','Sắc mặt anh không tốt lắm. Bình thường sinh hoạt có điều độ không?'],
 ['B','不太规律，经常熬夜加班，饮食也随意。','Bú tài guī lǜ, jīng cháng áo yè jiā bān, yǐn shí yě suí yì.','Không điều độ lắm, thường thức khuya tăng ca, ăn uống cũng tùy tiện.'],
 ['A','长期这样，免疫力会下降，还容易引起各种慢性疾病。','Cháng qī zhè yàng, miǎn yì lì huì xià jiàng, hái róng yì yǐn qǐ gè zhǒng màn xìng jí bìng.','Lâu dài như vậy sức đề kháng sẽ giảm, còn dễ gây ra các bệnh mãn tính.'],
 ['B','那我应该怎么调节？','Nà wǒ yīng gāi zěn me tiáo jié?','Vậy tôi nên điều chỉnh thế nào?'],
 ['A','首先要保证睡眠，少吃油腻的东西，多吃蔬菜水果，补充维生素。','Shǒu xiān yào bǎo zhèng shuì mián, shǎo chī yóu nì de dōng xi, duō chī shū cài shuǐ guǒ, bǔ chōng wéi shēng sù.','Trước hết phải đảm bảo giấc ngủ, ít ăn đồ dầu mỡ, ăn nhiều rau quả, bổ sung vitamin.'],
 ['A','另外，长时间坐着工作，要定期起来活动，可以练练太极拳。','Lìng wài, cháng shí jiān zuò zhe gōng zuò, yào dìng qī qǐ lai huó dòng, kě yǐ liàn lian tài jí quán.','Ngoài ra, ngồi làm việc lâu thì phải định kỳ đứng dậy vận động, có thể tập thái cực quyền.'],
 ['B','听您这么一说，我恍然大悟。健康才是最大的财富啊！','Tīng nín zhè me yì shuō, wǒ huǎng rán dà wù. Jiàn kāng cái shì zuì dà de cái fù a!','Nghe bác sĩ nói vậy tôi chợt hiểu ra. Sức khỏe mới là của cải lớn nhất!'],
 ['A','没错。养成好习惯，贵在坚持。','Méi cuò. Yǎng chéng hǎo xí guàn, guì zài jiān chí.','Đúng vậy. Tạo thói quen tốt, quý ở chỗ kiên trì.'],
]},
{id:70, lv:6, icon:'📰', title:'Tin đồn trên mạng', zh:'网络谣言', zpy:'wǎng luò yáo yán', who:{A:'Tổng biên tập',B:'Phóng viên'},
 scene:'Tòa soạn bàn cách đính chính một tin đồn sai lan truyền trên mạng.',
 tip:'纯粹是… = hoàn toàn là…. 作为媒体 = với tư cách là báo chí. 务必 = nhất thiết phải.',
 extra:[['有毒','yǒu dú','có độc',0],['合格','hé gé','đạt chuẩn',0],['转发','zhuǎn fā','chia sẻ lại',0],['网友','wǎng yǒu','cư dân mạng',0],['商家','shāng jiā','nhà bán hàng',0],['核对','hé duì','đối chiếu, kiểm tra',0],['轻易','qīng yì','dễ dàng, tùy tiện',0]],
 lines:[
 ['A','最近网上流传一条消息，说某品牌的牛奶有毒，你调查过了吗？','Zuì jìn wǎng shang liú chuán yì tiáo xiāo xi, shuō mǒu pǐn pái de niú nǎi yǒu dú, nǐ diào chá guo le ma?','Gần đây trên mạng lan truyền tin một hãng sữa có độc, em điều tra chưa?'],
 ['B','调查过了。这纯粹是谣言，官方已经发布声明，证实产品质量合格。','Diào chá guo le. Zhè chún cuì shì yáo yán, guān fāng yǐ jīng fā bù shēng míng, zhèng shí chǎn pǐn zhì liàng hé gé.','Điều tra rồi ạ. Đây hoàn toàn là tin đồn, cơ quan chức năng đã ra thông báo xác nhận sản phẩm đạt chuẩn.'],
 ['A','可是这条消息被转发了几十万次，舆论影响很大。','Kě shì zhè tiáo xiāo xi bèi zhuǎn fā le jǐ shí wàn cì, yú lùn yǐng xiǎng hěn dà.','Nhưng tin này đã bị chia sẻ mấy trăm nghìn lần, ảnh hưởng dư luận rất lớn.'],
 ['B','是啊，很多网友不加分辨就相信了，商家遭受了严重的损失。','Shì a, hěn duō wǎng yǒu bù jiā fēn biàn jiù xiāng xìn le, shāng jiā zāo shòu le yán zhòng de sǔn shī.','Vâng, nhiều cư dân mạng tin ngay không phân biệt, nhà sản xuất chịu thiệt hại nặng.'],
 ['A','我们作为媒体，有责任澄清事实真相。','Wǒ men zuò wéi méi tǐ, yǒu zé rèn chéng qīng shì shí zhēn xiàng.','Chúng ta là báo chí, có trách nhiệm làm rõ sự thật.'],
 ['B','我已经写好了稿件，引用了检验报告和专家的观点。','Wǒ yǐ jīng xiě hǎo le gǎo jiàn, yǐn yòng le jiǎn yàn bào gào hé zhuān jiā de guān diǎn.','Em đã viết xong bài, có trích dẫn báo cáo kiểm nghiệm và quan điểm chuyên gia.'],
 ['A','很好。发表之前再核对一遍数据，务必做到准确。','Hěn hǎo. Fā biǎo zhī qián zài hé duì yí biàn shù jù, wù bì zuò dào zhǔn què.','Tốt. Trước khi đăng kiểm tra lại số liệu một lượt, nhất định phải chính xác.'],
 ['B','放心吧。我还建议大家提高警惕，不要轻易相信没有来源的信息。','Fàng xīn ba. Wǒ hái jiàn yì dà jiā tí gāo jǐng tì, bú yào qīng yì xiāng xìn méi yǒu lái yuán de xìn xī.','Anh yên tâm. Em còn khuyên mọi người nâng cao cảnh giác, đừng dễ dàng tin thông tin không có nguồn.'],
]},
{id:71, lv:6, icon:'🌐', title:'Hội đàm hợp tác chiến lược', zh:'战略合作', zpy:'zhàn lüè hé zuò', who:{A:'Giám đốc công ty Việt Nam',B:'Chủ tịch tập đoàn Trung Quốc'},
 scene:'Hai doanh nghiệp gặp nhau bàn việc lập công ty liên doanh.',
 tip:'久仰 = nghe danh đã lâu. 优势互补 = bổ sung ưu thế cho nhau. 做东 = làm chủ tiệc, mời.',
 extra:[['远道而来','yuǎn dào ér lái','từ xa đến',0],['久仰','jiǔ yǎng','nghe danh đã lâu',0],['物流','wù liú','hậu cần, logistics',0],['互补','hù bǔ','bổ sung cho nhau',0],['合资','hé zī','liên doanh',0],['进一步','jìn yí bù','thêm một bước',0],['双赢','shuāng yíng','đôi bên cùng có lợi',0],['意向书','yì xiàng shū','biên bản ghi nhớ',0]],
 lines:[
 ['B','欢迎各位远道而来！请允许我先介绍一下我们集团的情况。','Huān yíng gè wèi yuǎn dào ér lái! Qǐng yǔn xǔ wǒ xiān jiè shào yí xià wǒ men jí tuán de qíng kuàng.','Hoan nghênh các vị từ xa đến! Cho phép tôi giới thiệu trước về tập đoàn chúng tôi.'],
 ['B','我们主要从事纺织品的加工和出口，在越南也有几家工厂。','Wǒ men zhǔ yào cóng shì fǎng zhī pǐn de jiā gōng hé chū kǒu, zài Yuè nán yě yǒu jǐ jiā gōng chǎng.','Chúng tôi chủ yếu gia công và xuất khẩu hàng dệt may, ở Việt Nam cũng có vài nhà máy.'],
 ['A','久仰贵集团的大名。我们公司在越南有完备的销售渠道和物流网络。','Jiǔ yǎng guì jí tuán de dà míng. Wǒ men gōng sī zài Yuè nán yǒu wán bèi de xiāo shòu qú dào hé wù liú wǎng luò.','Nghe danh quý tập đoàn đã lâu. Công ty chúng tôi có kênh bán hàng và mạng lưới logistics hoàn chỉnh ở Việt Nam.'],
 ['B','那我们双方优势互补，合作的前景非常广阔。','Nà wǒ men shuāng fāng yōu shì hù bǔ, hé zuò de qián jǐng fēi cháng guǎng kuò.','Vậy hai bên bổ sung ưu thế cho nhau, triển vọng hợp tác vô cùng rộng mở.'],
 ['A','我们初步设想成立一家合资公司，股份各占一半。','Wǒ men chū bù shè xiǎng chéng lì yì jiā hé zī gōng sī, gǔ fèn gè zhàn yí bàn.','Bước đầu chúng tôi dự tính lập một công ty liên doanh, cổ phần mỗi bên một nửa.'],
 ['B','这个提议值得考虑。不过具体的条款，还需要双方的律师仔细斟酌。','Zhè ge tí yì zhí de kǎo lǜ. Bú guò jù tǐ de tiáo kuǎn, hái xū yào shuāng fāng de lǜ shī zǐ xì zhēn zhuó.','Đề nghị này đáng cân nhắc. Nhưng điều khoản cụ thể còn cần luật sư hai bên xem xét kỹ.'],
 ['A','当然。我们可以先签署一份合作意向书，再进一步洽谈细节。','Dāng rán. Wǒ men kě yǐ xiān qiān shǔ yí fèn hé zuò yì xiàng shū, zài jìn yí bù qià tán xì jié.','Tất nhiên. Chúng ta có thể ký biên bản ghi nhớ hợp tác trước, rồi bàn tiếp chi tiết.'],
 ['B','好！希望我们的合作能实现双赢。','Hǎo! Xī wàng wǒ men de hé zuò néng shí xiàn shuāng yíng.','Được! Mong sự hợp tác của chúng ta đạt được đôi bên cùng có lợi.'],
 ['A','今晚我们做东，请各位品尝地道的越南菜。','Jīn wǎn wǒ men zuò dōng, qǐng gè wèi pǐn cháng dì dao de Yuè nán cài.','Tối nay chúng tôi mời, xin mời các vị thưởng thức món Việt chính gốc.'],
]},
{id:72, lv:6, icon:'🫖', title:'Văn hóa trà', zh:'茶文化', zpy:'chá wén huà', who:{A:'Chủ quán trà',B:'Khách Việt Nam'},
 scene:'Khách Việt ghé một quán trà ở Hàng Châu, được chủ quán mời thử trà Long Tỉnh.',
 tip:'喝起来 = uống vào thấy. 原来 = hóa ra. 各地有各地的… = mỗi nơi có… riêng.',
 extra:[['回味无穷','huí wèi wú qióng','dư vị khó quên',0],['龙井','Lóng jǐng','trà Long Tỉnh',0],['杭州','Háng zhōu','Hàng Châu',0],['水温','shuǐ wēn','nhiệt độ nước',0],['瓷器','cí qì','đồ sứ',0],['绿茶','lǜ chá','trà xanh',0]],
 lines:[
 ['A','请坐。这是今年的新茶，您品尝一下。','Qǐng zuò. Zhè shì jīn nián de xīn chá, nín pǐn cháng yí xià.','Mời ngồi. Đây là trà mới năm nay, mời anh nếm thử.'],
 ['B','好香啊！喝起来清淡，但是回味无穷。','Hǎo xiāng a! Hē qi lai qīng dàn, dàn shì huí wèi wú qióng.','Thơm quá! Uống vào thanh nhẹ mà dư vị khó quên.'],
 ['A','这是龙井，产自杭州。泡茶的水温不能太高，八十度左右最恰当。','Zhè shì Lóng jǐng, chǎn zì Háng zhōu. Pào chá de shuǐ wēn bù néng tài gāo, bā shí dù zuǒ yòu zuì qià dàng.','Đây là trà Long Tỉnh, sản xuất ở Hàng Châu. Nước pha trà không được quá nóng, khoảng tám mươi độ là vừa nhất.'],
 ['B','原来泡茶这么讲究！中国的茶文化真是博大精深。','Yuán lái pào chá zhè me jiǎng jiu! Zhōng guó de chá wén huà zhēn shì bó dà jīng shēn.','Hóa ra pha trà cầu kỳ thế! Văn hóa trà Trung Quốc thật uyên thâm.'],
 ['A','是啊。中国人喝茶已经有几千年的历史了，茶和瓷器一起传到了世界各地。','Shì a. Zhōng guó rén hē chá yǐ jīng yǒu jǐ qiān nián de lì shǐ le, chá hé cí qì yì qǐ chuán dào le shì jiè gè dì.','Đúng vậy. Người Trung Quốc uống trà đã mấy nghìn năm, trà cùng đồ sứ đã lan ra khắp thế giới.'],
 ['B','越南人也爱喝茶，不过我们更喜欢喝绿茶，而且常常加冰。','Yuè nán rén yě ài hē chá, bú guò wǒ men gèng xǐ huan hē lǜ chá, ér qiě cháng cháng jiā bīng.','Người Việt cũng thích uống trà, nhưng chúng tôi thích trà xanh hơn, lại hay thêm đá.'],
 ['A','各地有各地的习俗嘛。喝茶最重要的是心态，静下心来，享受时光。','Gè dì yǒu gè dì de xí sú ma. Hē chá zuì zhòng yào de shì xīn tài, jìng xia xīn lai, xiǎng shòu shí guāng.','Mỗi nơi có tập tục riêng mà. Uống trà quan trọng nhất là tâm thế, tĩnh tâm lại mà tận hưởng thời gian.'],
 ['B','说得太好了。我想买一些龙井带回去，作为礼物送给长辈。','Shuō de tài hǎo le. Wǒ xiǎng mǎi yì xiē Lóng jǐng dài huí qu, zuò wéi lǐ wù sòng gěi zhǎng bèi.','Nói hay quá. Tôi muốn mua ít Long Tỉnh mang về làm quà biếu người lớn.'],
 ['A','没问题，我给您包装得精致一点儿。','Méi wèn tí, wǒ gěi nín bāo zhuāng de jīng zhì yì diǎnr.','Không vấn đề, tôi gói cho anh thật tinh tế.'],
]},
{id:73, lv:6, icon:'🙌', title:'Đăng ký làm tình nguyện viên', zh:'志愿者', zpy:'zhì yuàn zhě', who:{A:'Trưởng nhóm tình nguyện',B:'Sinh viên'},
 scene:'Sinh viên đăng ký lên vùng núi dạy học cho trẻ em nghèo.',
 tip:'对我来说 = đối với tôi mà nói. 擅长 = giỏi về. 不在乎 = không để ý, không màng.',
 extra:[['志愿者','zhì yuàn zhě','tình nguyện viên',0],['山区','shān qū','vùng núi',0],['农村','nóng cūn','nông thôn',0],['食宿','shí sù','ăn ở',0],['艺术','yì shù','nghệ thuật',0]],
 lines:[
 ['B','您好，我在网上看到你们招收志愿者，我想报名。','Nín hǎo, wǒ zài wǎng shang kàn dào nǐ men zhāo shōu zhì yuàn zhě, wǒ xiǎng bào míng.','Chào anh, em thấy trên mạng nhóm đang tuyển tình nguyện viên, em muốn đăng ký.'],
 ['A','欢迎！我们这个项目是去偏僻的山区，给贫困的孩子上课。','Huān yíng! Wǒ men zhè ge xiàng mù shì qù piān pì de shān qū, gěi pín kùn de hái zi shàng kè.','Hoan nghênh! Dự án của bọn anh là lên vùng núi hẻo lánh dạy học cho trẻ em nghèo.'],
 ['A','那里条件很艰苦，没有网络，交通也不方便，你能承受吗？','Nà li tiáo jiàn hěn jiān kǔ, méi yǒu wǎng luò, jiāo tōng yě bù fāng biàn, nǐ néng chéng shòu ma?','Ở đó điều kiện rất gian khổ, không có mạng, đi lại cũng bất tiện, em chịu được không?'],
 ['B','没问题。我从小在农村长大，吃苦对我来说不算什么。','Méi wèn tí. Wǒ cóng xiǎo zài nóng cūn zhǎng dà, chī kǔ duì wǒ lái shuō bú suàn shén me.','Không sao ạ. Em lớn lên ở nông thôn từ nhỏ, chịu khổ với em chẳng là gì.'],
 ['A','你有什么特长？','Nǐ yǒu shén me tè cháng?','Em có sở trường gì?'],
 ['B','我擅长画画儿和唱歌，还可以教孩子们简单的英语。','Wǒ shàn cháng huà huàr hé chàng gē, hái kě yǐ jiào hái zi men jiǎn dān de Yīng yǔ.','Em giỏi vẽ và hát, còn có thể dạy các em tiếng Anh đơn giản.'],
 ['A','太好了！孩子们最缺乏的就是艺术课。这个工作是无偿的，不过我们会提供食宿。','Tài hǎo le! Hái zi men zuì quē fá de jiù shì yì shù kè. Zhè ge gōng zuò shì wú cháng de, bú guò wǒ men huì tí gōng shí sù.','Tuyệt quá! Các em thiếu nhất là giờ học nghệ thuật. Công việc này không có lương, nhưng bọn anh lo ăn ở.'],
 ['B','我不在乎报酬。能为社会奉献一点儿力量，我觉得很有意义。','Wǒ bú zài hu bào chou. Néng wèi shè huì fèng xiàn yì diǎnr lì liang, wǒ jué de hěn yǒu yì yì.','Em không màng thù lao. Góp chút sức cho xã hội, em thấy rất ý nghĩa.'],
 ['A','你的心灵真美！下周一我们开培训会，请准时参加。','Nǐ de xīn líng zhēn měi! Xià zhōu yī wǒ men kāi péi xùn huì, qǐng zhǔn shí cān jiā.','Tâm hồn em đẹp quá! Thứ hai tuần sau có buổi tập huấn, em nhớ đến đúng giờ nhé.'],
]},
{id:74, lv:6, icon:'🥂', title:'Phép lịch sự trên bàn tiệc', zh:'职场应酬', zpy:'zhí chǎng yìng chou', who:{A:'Anh Trương (đồng nghiệp)',B:'Nhân viên mới'},
 scene:'Nhân viên mới hỏi đồng nghiệp lâu năm về phép tắc khi đi tiếp khách.',
 tip:'关键是… = mấu chốt là…. 以茶代酒 = lấy trà thay rượu. 万一 = lỡ như.',
 extra:[['座位','zuò wèi','chỗ ngồi',0],['敬酒','jìng jiǔ','mời rượu',0],['酒量','jiǔ liàng','tửu lượng',0],['以茶代酒','yǐ chá dài jiǔ','lấy trà thay rượu',0],['指点','zhǐ diǎn','chỉ bảo',0],['职场','zhí chǎng','chốn công sở',0]],
 lines:[
 ['B','张哥，今晚跟客户吃饭，我有点儿紧张，不知道该注意什么。','Zhāng gē, jīn wǎn gēn kè hù chī fàn, wǒ yǒu diǎnr jǐn zhāng, bù zhī dào gāi zhù yì shén me.','Anh Trương ơi, tối nay ăn với khách, em hơi căng thẳng, không biết phải chú ý gì.'],
 ['A','别担心。在中国，应酬是工作的一部分，关键是要懂礼节。','Bié dān xīn. Zài Zhōng guó, yìng chou shì gōng zuò de yí bù fen, guān jiàn shì yào dǒng lǐ jié.','Đừng lo. Ở Trung Quốc, tiếp khách là một phần công việc, mấu chốt là hiểu phép tắc.'],
 ['B','座位有什么讲究吗？','Zuò wèi yǒu shén me jiǎng jiu ma?','Chỗ ngồi có gì cần chú ý không ạ?'],
 ['A','主人一般坐在面对门的位置，客人坐在主人的右边。你等领导安排就行。','Zhǔ rén yì bān zuò zài miàn duì mén de wèi zhi, kè rén zuò zài zhǔ rén de yòu bian. Nǐ děng lǐng dǎo ān pái jiù xíng.','Chủ tiệc thường ngồi chỗ đối diện cửa, khách ngồi bên phải chủ. Em cứ đợi sếp sắp xếp là được.'],
 ['B','敬酒的时候呢？','Jìng jiǔ de shí hou ne?','Còn lúc mời rượu thì sao ạ?'],
 ['A','要双手举杯，杯子比对方的低一点儿，表示尊重。说几句祝福的话就可以了。','Yào shuāng shǒu jǔ bēi, bēi zi bǐ duì fāng de dī yì diǎnr, biǎo shì zūn zhòng. Shuō jǐ jù zhù fú de huà jiù kě yǐ le.','Phải nâng ly bằng hai tay, ly thấp hơn ly đối phương một chút để tỏ lòng tôn trọng. Nói vài câu chúc là được.'],
 ['B','我酒量不好，万一喝醉了多丢人啊。','Wǒ jiǔ liàng bù hǎo, wàn yī hē zuì le duō diū rén a.','Tửu lượng em kém, lỡ say thì mất mặt lắm.'],
 ['A','不要勉强自己，可以以茶代酒，客户一般都会体谅的。','Bú yào miǎn qiǎng zì jǐ, kě yǐ yǐ chá dài jiǔ, kè hù yì bān dōu huì tǐ liàng de.','Đừng gượng ép bản thân, có thể lấy trà thay rượu, khách thường đều thông cảm.'],
 ['B','谢谢张哥指点！我心里踏实多了。','Xiè xie Zhāng gē zhǐ diǎn! Wǒ xīn li tā shi duō le.','Cảm ơn anh Trương chỉ bảo! Em thấy yên tâm hơn nhiều rồi.'],
]},
{id:75, lv:6, icon:'🌪️', title:'Biến đổi khí hậu và thiên tai', zh:'自然灾害', zpy:'zì rán zāi hài', who:{A:'Người dẫn chương trình',B:'Chuyên gia khí tượng'},
 scene:'Chương trình truyền hình phỏng vấn chuyên gia về thời tiết cực đoan.',
 tip:'一方面…另一方面… = một mặt… mặt khác…. 导致 = dẫn đến. 人人有责 = ai cũng có trách nhiệm.',

<script>
// ===== ỨNG DỤNG =====
const KEY='hoc-tieng-trung-v1';
const S=Object.assign({lv:1,vRepeat:false,done:{},best:{},known:{},wrong:{},slow:false,showPy:true,showVi:true,showMean:true},JSON.parse(localStorage.getItem(KEY)||'{}'));
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);

// --- Từ điển ---
const BANK=[],DICT={},TOPICS={};
const RAWS={1:RAW_HSK1};try{RAWS[2]=RAW_HSK2;LESSONS.push(...LESSONS2)}catch(e){}
try{RAWS[3]=RAW_HSK3;LESSONS.push(...LESSONS3)}catch(e){}
try{RAWS[4]=RAW_HSK4;LESSONS.push(...LESSONS4)}catch(e){}
try{RAWS[5]=RAW_HSK5;LESSONS.push(...LESSONS5)}catch(e){}
try{RAWS[6]=RAW_HSK6;LESSONS.push(...LESSONS6)}catch(e){}
function autoWords(L){const ex=new Set((L.extra||[]).map(e=>e[0]));const out=[];L.lines.forEach(l=>segment(l[1]).forEach(z=>{const w=DICT[z];if(w&&(w.lv===L.lv||ex.has(z))&&!out.includes(z))out.push(z)}));return out}
(()=>{for(const lv in RAWS){let topic='';TOPICS[lv]=[];RAWS[lv].trim().split('\n').forEach(l=>{l=l.trim();if(!l)return;if(l[0]==='#'){topic=l.slice(1).trim();TOPICS[lv].push(topic);return}
  const [zh,py,mean,em]=l.split('|');if(DICT[zh])return;const w={zh,py,mean,em:em||'',topic,lv:+lv};BANK.push(w);DICT[zh]=w})}
  LESSONS.forEach(L=>{L.lv=L.lv||1;(L.extra||[]).forEach(([zh,py,mean,lv])=>{if(!DICT[zh])DICT[zh]={zh,py,mean,em:'',topic:'Từ mở rộng',lv:lv??0}})});
  const c={};LESSONS.forEach(L=>{L.n=c[L.lv]=(c[L.lv]||0)+1;if(!L.words)L.words=autoWords(L)});})();
LEVELS.forEach(l=>l.ready=BANK.some(w=>w.lv===l.lv));
let CURLV=1;
const lvLessons=lv=>LESSONS.filter(L=>L.lv===lv);
const lvChips=(act,cur)=>`<div class="chips">${LEVELS.map(l=>`<button class="chip ${cur===l.lv?'on':''}" data-act="${act}" data-lv="${l.lv}">HSK${l.lv}${l.ready?'':' ⏳'}</button>`).join('')}</div>`;
const lessonWords=L=>L.words.map(z=>DICT[z]).filter(Boolean);
const lvTag=w=>w.lv===CURLV?'':`<span class="tag">${w.lv?'HSK'+w.lv:'mở rộng'}</span>`;

// --- Pinyin → phiên âm tiếng Việt (gần đúng) ---
const TM={};'āáǎàa ēéěèe īíǐìi ōóǒòo ūúǔùu ǖǘǚǜü'.split(' ').forEach(g=>{const b=g[4];[...g.slice(0,4)].forEach((c,i)=>TM[c]=[b,i+1])});
function parseSyl(s){let base='',tone=5;for(const ch of s.toLowerCase()){if(TM[ch]){base+=TM[ch][0];tone=TM[ch][1]}else base+=(ch==='v'?'ü':ch)}return{base,tone}}
const YW={yi:'i',ya:'da',yo:'dô',ye:'dê',yao:'dao',you:'dâu',yan:'dên',yin:'in',yang:'dang',ying:'inh',yong:'dung',yu:'duy',yue:'duê',yuan:'doen',yun:'duyn',wu:'u',wa:'oa',wo:'ua',wai:'oai',wei:'uây',wan:'oan',wen:'uân',wang:'oang',weng:'uâng'};
const INI=['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s'];
const IMAP={b:'p',p:"p'",m:'m',f:'ph',d:'t',t:'th',n:'n',l:'l',g:'c',k:'kh',h:'h',j:'ch',q:"ch'",x:'x',zh:'tr',ch:"tr'",sh:'s',r:'r',z:'ch',c:"ts'",s:'x'};
const FMAP={a:'a',o:'ua',e:'ưa',i:'i',u:'u','ü':'uy',ai:'ai',ei:'ây',ao:'ao',ou:'âu',an:'an',en:'ân',ang:'ang',eng:'âng',ong:'ung',er:'ơ',ia:'ia',ie:'iê',iao:'eo',iu:'iêu',ian:'iên',in:'in',iang:'eng',ing:'inh',iong:'iung',ua:'oa',uo:'ua',uai:'oai',ui:'uây',uan:'oan',un:'uân',uang:'oang','üe':'uê','üan':'oen','ün':'uyn'};
const JQX={u:'uy',ue:'uê',uan:'oen',un:'uyn'};
function viTone(w,t){const mk={2:'́',3:'̉',4:'̀'}[t];if(!mk)return w;const V='aăâeêioôơuưy';const idx=[];for(let i=0;i<w.length;i++)if(V.includes(w[i]))idx.push(i);if(!idx.length)return w;
  const cl=[idx[0]];for(let k=1;k<idx.length&&idx[k]===idx[k-1]+1;k++)cl.push(idx[k]);
  const hasFinal=cl[cl.length-1]<w.length-1;let pos;const sp=cl.filter(i=>'ăâêôơư'.includes(w[i]));
  if(sp.length)pos=sp.find(i=>w[i]==='ơ')??sp[sp.length-1];else if(cl.length===1)pos=cl[0];else if(hasFinal)pos=cl[cl.length-1];else if(cl.length===3)pos=cl[1];
  else pos=['oa','oe','uy'].includes(w[cl[0]]+w[cl[1]])?cl[1]:cl[0];
  return(w.slice(0,pos+1)+mk+w.slice(pos+1)).normalize('NFC')}
function sylVi(tok){let {base,tone}=parseSyl(tok);let er=false;if(base.length>2&&base.endsWith('r')&&base!=='er'){er=true;base=base.slice(0,-1)}
  let out;if(YW[base])out=YW[base];else if(base==='er')out='ơ';else{let ini='';for(const i of INI)if(base.startsWith(i)){ini=i;break}let fin=base.slice(ini.length);let vf;
    if(fin==='i'&&['z','c','s','zh','ch','sh','r'].includes(ini))vf='ư';else if('jqx'.includes(ini)&&ini&&JQX[fin])vf=JQX[fin];else if(fin==='e'&&tone===5)vf='ơ';else vf=FMAP[fin]??fin;
    out=(IMAP[ini]??'')+vf}
  out=viTone(out,tone)+(er?'(r)':'');return /^[A-ZĀÁǍÀĒÉĚÈŌÓǑÒ]/.test(tok)?out[0].toUpperCase()+out.slice(1):out}
const PYRE=/[A-Za-züÜĀÁǍÀĒÉĚÈĪÍǏÌŌÓǑÒŪÚǓÙāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]+/g;
const toVi=py=>py.replace(PYRE,sylVi);

// --- Giọng đọc tiếng Trung ---
let VOICES=[];const loadV=()=>{VOICES=(window.speechSynthesis?.getVoices()||[])};if(window.speechSynthesis){loadV();speechSynthesis.onvoiceschanged=()=>{loadV();if(location.hash===''||location.hash==='#home')render()}}
const zhVoice=()=>VOICES.find(v=>/zh[-_]CN/i.test(v.lang))||VOICES.find(v=>/^(zh|cmn)/i.test(v.lang))||VOICES.find(v=>/chinese|中文|普通话|mandarin/i.test(v.name));
let speakTok=0;
function speak(text,o={}){if(!window.speechSynthesis){o.onend&&o.onend();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';const v=zhVoice();if(v)u.voice=v;
  u.rate=o.rate??(S.slow?0.55:0.85);u.pitch=o.pitch??1;const tok=++speakTok;const done=()=>{if(tok===speakTok&&o.onend)o.onend()};u.onend=done;u.onerror=done;speechSynthesis.speak(u)}
function stopAll(){speakTok++;window.speechSynthesis&&speechSynthesis.cancel();clearTimeout(autoT);auto=false;playing=false;typeof vStop==='function'&&vStop()}

// --- Nhận giọng nói (luyện nói) ---
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const onlyZh=s=>(s||'').replace(/[0-9]/g,d=>'零一二三四五六七八九'[d]).replace(/[^㐀-鿿]/g,'');
function lcs(a,b){const d=Array(b.length+1).fill(0);for(const x of a){let prev=0;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=x===b[j-1]?prev+1:Math.max(d[j],d[j-1]);prev=t}}return d[b.length]}
function listen(target,out){out.innerHTML='';if(!SR){out.innerHTML='<span class="bad">Trình duyệt này chưa hỗ trợ nhận giọng nói. Hãy dùng Chrome trên Android hoặc máy tính; trên iPhone dùng Safari bản mới.</span>';return}
  stopAll();const r=new SR();r.lang='zh-CN';r.interimResults=false;r.maxAlternatives=5;out.innerHTML='<span class="rec">🎙️ Đang nghe… hãy nói</span>';
  r.onresult=e=>{const tz=onlyZh(target);let best={t:'',s:0};for(const a of e.results[0]){const t=a.transcript,s=tz.length?lcs(onlyZh(t),tz)/Math.max(tz.length,onlyZh(t).length):0;if(s>=best.s)best={t,s}}
    const p=Math.round(best.s*100);out.innerHTML=`<span class="${p>=80?'ok':p>=50?'mid':'bad'}">${p>=80?'🎉 Rất tốt!':p>=50?'👍 Gần đúng, thử lại nhé':'🔁 Chưa đúng, nghe lại rồi nói'} · ${p}%</span><br><span class="zh small">Máy nghe được: ${esc(best.t)||'…'}</span>`};
  r.onerror=e=>{out.innerHTML=`<span class="bad">${e.error==='not-allowed'||e.error==='service-not-allowed'?'Bạn cần cho phép dùng micro.':e.error==='no-speech'?'Không nghe thấy gì, thử lại nhé.':'Lỗi nhận giọng: '+esc(e.error)}</span>`};
  r.onend=()=>{if(out.querySelector('.rec'))out.innerHTML='<span class="bad">Không nghe thấy gì, thử lại nhé.</span>'};
  try{r.start()}catch(e){out.innerHTML='<span class="bad">Không mở được micro.</span>'}}

// --- Thành phần giao diện ---
const btnSay=(zh,label='🔊',cls='')=>`<button class="ib ${cls}" data-act="say" data-zh="${esc(zh)}" aria-label="Nghe">${label}</button>`;
const btnSlow=zh=>`<button class="ib" data-act="say" data-zh="${esc(zh)}" data-slow="1" aria-label="Nghe chậm">🐢</button>`;
let micN=0;
const btnMic=zh=>{const id='m'+(++micN);return`<button class="ib mic" data-act="mic" data-zh="${esc(zh)}" data-out="${id}" aria-label="Nói theo">🎤</button><div class="micout" id="${id}"></div>`};
const pyLine=py=>`<div class="py">${esc(py)}</div><div class="vi">${esc(toVi(py))}</div>`;
function wordRow(w,ctx=''){return`<div class="wrow"><div class="wz zh" data-act="say" data-zh="${esc(w.zh)}">${esc(w.zh)}</div><div class="wm"><div><b class="pyb">${esc(w.py)}</b> <span class="vi">${esc(toVi(w.py))}</span> ${lvTag(w)}</div><div class="mean">${w.em?w.em+' ':''}${esc(w.mean)}</div>${ctx}</div><div class="wa">${btnSay(w.zh)}<button class="ib ${S.known[w.zh]?'on':''}" data-act="known" data-zh="${esc(w.zh)}" aria-label="Đã thuộc">${S.known[w.zh]?'⭐':'☆'}</button></div></div>`}
const toggles=()=>`<div class="toggles"><button class="chip ${S.showPy?'on':''}" data-act="tog" data-k="showPy">Pinyin</button><button class="chip ${S.showVi?'on':''}" data-act="tog" data-k="showVi">Phiên âm Việt</button><button class="chip ${S.showMean?'on':''}" data-act="tog" data-k="showMean">Nghĩa</button><button class="chip ${S.slow?'on':''}" data-act="tog" data-k="slow">🐢 Đọc chậm</button></div>`;
function applyPrefs(){const b=document.body.classList;b.toggle('hide-py',!S.showPy);b.toggle('hide-vi',!S.showVi);b.toggle('hide-mean',!S.showMean)}
const voiceWarn=()=>!window.speechSynthesis?`<div class="warn">Trình duyệt này không đọc to được. Hãy mở bằng Chrome hoặc Safari.</div>`:(VOICES.length&&!zhVoice()?`<div class="warn"><b>Máy chưa có giọng đọc tiếng Trung.</b> Android: Cài đặt → Hệ thống → Ngôn ngữ → Chuyển văn bản thành giọng nói → Công cụ của Google → cài "Tiếng Trung (Trung Quốc)". iPhone: Cài đặt → Trợ năng → Nội dung được đọc → Giọng nói → Tiếng Trung.</div>`:'');

// --- Trang chủ ---
function vHome(){CURLV=S.lv;const n=Object.keys(S.done).length,LL=lvLessons(S.lv),next=LL.find(L=>!S.done[L.id])||LL[0];const known=Object.keys(S.known).length,wrong=Object.keys(S.wrong).length;
 return`${voiceWarn()}<section class="hero"><h2>Học như trẻ em Trung Quốc</h2><p>Trẻ em học nói theo thứ tự: nghe thật nhiều, bắt chước âm thanh, nói theo cả câu, rồi mới nhận mặt chữ. App đi đúng các bước đó.</p>

const toneSvg=t=>{const p={1:'M6 8 L54 8',2:'M6 34 L54 6',3:'M6 18 L26 38 L54 10',4:'M6 6 L54 38'}[t];return`<svg viewBox="0 0 60 44" class="tsvg" aria-hidden="true"><path d="${p}"/></svg>`};
let toneGame=null;
function vPinyin(){return`${voiceWarn()}<h2>Pinyin nhập môn</h2><p class="lead">Trẻ em Trung Quốc vào lớp 1 học pinyin trước khi học chữ. Pinyin là cách ghi âm tiếng Trung bằng chữ cái Latin, gồm <b>thanh mẫu</b> (phụ âm đầu), <b>vận mẫu</b> (vần) và <b>thanh điệu</b>. Bấm vào ô bất kỳ để nghe.</p>
 <h3>1. Bốn thanh điệu</h3><div class="tones">${TONES.map(t=>`<div class="tone"><div class="th">${toneSvg(t.t)}<div><b>${t.name}</b><small>${t.vi}</small></div></div><div class="tex">${t.ex.map(e=>`<button class="tbtn" data-act="say" data-zh="${e[0]}"><span class="zh">${e[0]}</span><span class="pyb">${e[1]}</span><small>${e[2]}</small></button>`).join('')}</div></div>`).join('')}</div>
 <p class="note">Ngoài ra có <b>thanh nhẹ</b> (không dấu), đọc ngắn và nhẹ, ví dụ 妈妈 mā<b>ma</b>, 吗 ma.</p>
 <div class="card game"><h4>🎯 Trò chơi: nghe đoán thanh</h4><div id="tg">${tgView()}</div></div>
 <h3>2. Thanh mẫu (phụ âm đầu)</h3><div class="pgrid">${INITIALS.map(([k,z,p])=>`<button class="pc" data-act="say" data-zh="${z}"><b>${k}</b><span class="zh">${z}</span><small>${p} · ${toVi(p)}</small></button>`).join('')}</div>
 <h3>3. Vận mẫu (vần)</h3><div class="pgrid">${FINALS.map(([k,z,p])=>`<button class="pc" data-act="say" data-zh="${z}"><b>${k}</b><span class="zh">${z}</span><small>${p} · ${toVi(p)}</small></button>`).join('')}</div>
 <h3>4. Quy tắc biến điệu cần nhớ</h3><div class="card"><ul class="rules"><li>Hai thanh 3 đứng liền nhau thì chữ đầu đọc thành thanh 2: 你好 nǐ hǎo đọc là <b>ní hǎo</b>. ${btnSay('你好')}</li><li>不 (bù) đứng trước thanh 4 đọc thành <b>bú</b>: 不是 bú shì. ${btnSay('不是')}</li><li>一 (yī) đứng trước thanh 4 đọc <b>yí</b>, trước thanh 1, 2, 3 đọc <b>yì</b>: 一个 yí ge, 一些 yì xiē. ${btnSay('一个')}</li></ul><p class="small">Trong app, pinyin đã ghi theo cách đọc thực tế sau biến điệu của 不 và 一.</p></div>
 <h3>5. Cách đọc phần phiên âm tiếng Việt</h3><div class="card"><p>Dòng phiên âm tiếng Việt chỉ giúp đọc gần đúng lúc mới học. Luôn nghe giọng đọc và nhìn pinyin để phát âm chuẩn.</p><ul class="rules"><li>Thanh 1 → không dấu, thanh 2 → dấu sắc, thanh 3 → dấu hỏi, thanh 4 → dấu huyền, thanh nhẹ → không dấu.</li><li>Dấu <b>'</b> nghĩa là bật hơi mạnh: p' (p), ch' (q), tr' (ch), ts' (c). Còn t → th, k → kh.</li><li>zh đọc gần "tr" uốn lưỡi, sh gần "s" uốn lưỡi, r gần "r" nhẹ, z gần "ch" đầu lưỡi, x gần "x" bẹt.</li><li>ü đọc tròn môi như "uy". (r) ở cuối là âm cuốn lưỡi "nhi hóa", như 哪儿 nǎr.</li></ul></div>`}
function tgView(){if(!toneGame)return`<p class="small">Máy đọc một chữ, bạn chọn thanh điệu đúng. 10 lượt.</p><button class="btn" data-act="tgStart">Bắt đầu chơi</button>`;
 const g=toneGame;if(g.i>=10)return`<p><b>Bạn đúng ${g.score}/10.</b> ${g.score>=8?'Tai rất thính! 🎉':'Nghe thêm vài lần nữa nhé.'}</p><button class="btn" data-act="tgStart">Chơi lại</button>`;
 return`<p class="small">Lượt ${g.i+1}/10 · Đúng: ${g.score}</p><button class="btn ghost" data-act="tgPlay">🔊 Nghe lại</button><div class="tchoices">${[1,2,3,4].map(t=>`<button class="tbtn ${g.ans!=null?(t===g.cur.t?'right':t===g.ans?'wrongc':''):''}" data-act="tgAns" data-t="${t}" ${g.ans!=null?'disabled':''}>${toneSvg(t)}<b>Thanh ${t}</b></button>`).join('')}</div>${g.ans!=null?`<p>${g.ans===g.cur.t?'✅ Đúng!':'❌ Chưa đúng.'} <span class="zh">${g.cur.zh}</span> <b class="pyb">${g.cur.py}</b></p><button class="btn" data-act="tgNext">Tiếp ›</button>`:''}`}
function tgNew(){const s=Math.random()*5|0,t=Math.random()*4|0;toneGame.cur={zh:TONE_SETS[s][t],py:TONE_SET_PY[s][t],t:t+1};toneGame.ans=null;speak(toneGame.cur.zh)}

let C=null,auto=false,autoT=0;
function cardView(){const w=C.pool[C.i];return`<div class="fc"><div class="fcbar"><span>${C.i+1} / ${C.pool.length}</span><button class="chip ${auto?'on':''}" data-act="auto">${auto?'⏸ Dừng tự phát':'▶ Tự động nghe'}</button></div>
 <div class="fcard" data-act="say" data-zh="${esc(w.zh)}"><div class="em">${w.em||'🀄'}</div><div class="zh fz">${esc(w.zh)}</div><div class="py pyb">${esc(w.py)}</div><div class="vi">${esc(toVi(w.py))}</div><div class="mean">${esc(w.mean)} ${lvTag(w)}</div><small class="hint">Chạm vào thẻ để nghe</small></div>
 <div class="fcnav"><button class="ib lg" data-act="cprev" aria-label="Trước">◀</button>${btnSlow(w.zh)}<button class="ib lg ${S.known[w.zh]?'on':''}" data-act="known" data-zh="${esc(w.zh)}" aria-label="Đã thuộc">${S.known[w.zh]?'⭐':'☆'}</button><button class="ib lg" data-act="cnext" aria-label="Sau">▶</button></div>
 <div class="speak"><p class="small">🗣️ Nói theo: bấm micro rồi đọc to từ này</p>${btnMic(w.zh)}</div></div>`}
function runAuto(){if(!auto||!C)return;const w=C.pool[C.i];speak(w.zh,{onend:()=>{autoT=setTimeout(()=>speak(w.zh,{onend:()=>{autoT=setTimeout(()=>{if(!auto)return;C.i=(C.i+1)%C.pool.length;$('#cards').innerHTML=cardView();runAuto()},1600)}}),1200)}})}

  <div class="dlg">${L.lines.map((l,i)=>`<div class="bub ${l[0]==='A'?'me':''}" id="ln${i}"><div class="who">${esc(L.who[l[0]]||l[0])}</div><div class="zh dz" data-act="say" data-zh="${esc(l[1])}">${esc(l[1])}</div>${pyLine(l[2])}<div class="mean">${esc(l[3])}</div><div class="bact">${btnSay(l[1])}${btnSlow(l[1])}${btnMic(l[1])}</div></div>`).join('')}</div>
