  ${ws.map(w=>{const ln=L.lines.find(l=>l[1].includes(w.zh));return wordRow(w,ln?`<div class="ctx zh" data-act="say" data-zh="${esc(ln[1])}">${esc(ln[1]).split(esc(w.zh)).join(`<mark>${esc(w.zh)}</mark>`)}</div>`:'')}).join('')}`}
 else if(tab==='quiz'){body=`<p class="lead">Kiểm tra lại từ vựng và câu trong bài: nghe chọn chữ, chọn nghĩa, chọn đúng thanh điệu và sắp xếp câu.${S.best[L.id]!=null?` Điểm cao nhất của bạn: <b>${S.best[L.id]}%</b>.`:''}</p><button class="btn big" data-act="quizLesson" data-id="${L.id}">Bắt đầu kiểm tra (12 câu)</button>`}
 return`<a class="back" href="#lessons">‹ Danh sách bài</a><div class="lhead"><span class="li">${L.icon}</span><div><small>HSK${L.lv} · Bài ${L.n}</small><h2>${esc(L.title)} <span class="zh">${L.zh}</span></h2></div></div>${lessonTabs(L,tab)}${body}`}
function playAll(L,i=0){if(i===0)playing=true;if(!playing)return;document.querySelectorAll('.bub').forEach(b=>b.classList.remove('cur'));if(i>=L.lines.length){playing=false;return}

let Q=null;
const allLines=()=>lvLessons(S.lv).flatMap(L=>L.lines);const lvBank=()=>BANK.filter(w=>w.lv===S.lv);
function segment(zh){const t=zh.replace(/[^㐀-鿿]/g,'');const out=[];let i=0;while(i<t.length){let k=Math.min(4,t.length-i);for(;k>1;k--)if(DICT[t.substr(i,k)])break;out.push(t.substr(i,k));i+=k}return out}
const TV={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
function pyMark(base,t){if(t===5)return base;let i=base.search(/[ae]/);if(i<0)i=base.indexOf('ou');if(i<0)for(let k=base.length-1;k>=0;k--)if('iouü'.includes(base[k])){i=k;break}return i<0?base:base.slice(0,i)+TV[base[i]][t-1]+base.slice(i+1)}
function toneVariants(py){const sy=py.split(' ');const set=new Set([py]);let guard=0;while(set.size<4&&guard++<60){const v=sy.map(s=>{const {base,tone}=parseSyl(s);if(tone===5||Math.random()<.4)return s.toLowerCase()===s?s:s;let t;do{t=1+(Math.random()*4|0)}while(t===tone);const r=pyMark(base,t);return s[0]!==s[0].toLowerCase()?r[0].toUpperCase()+r.slice(1):r}).join(' ');set.add(v)}return shuffle([...set])}
function makeQ(w,type,pool){const others=pool.filter(x=>x.zh!==w.zh);const fill=BANK.filter(x=>x.zh!==w.zh);
 const distinct=(key,n)=>{const seen=new Set([w[key]]),res=[];for(const x of shuffle(others).concat(shuffle(fill))){if(!seen.has(x[key])){seen.add(x[key]);res.push(x)}if(res.length>=n)break}return res};
 if(type==='tone'){const opts=toneVariants(w.py);if(opts.length<2)type='meaning';else return{type,w,opts,ans:w.py}}
 const key=type==='meaning'?'mean':'zh';return{type,w,opts:shuffle([w,...distinct(key,3)]).map(x=>x[key]),ans:w[key]}}
function startQuiz(words,{lines=[],n=12,types=['listen','meaning','reverse','tone'],orders=3,ctx={}}){const qs=[];const ws=shuffle(words);
 const nw=Math.max(0,n-Math.min(orders,lines.length));ws.slice(0,nw).forEach((w,i)=>qs.push(makeQ(w,types[i%types.length],words)));
 pick(lines.filter(l=>segment(l[1]).length>=3&&segment(l[1]).length<=9),orders).forEach(l=>{const seg=segment(l[1]);let sh;do{sh=shuffle(seg)}while(seg.length>1&&sh.join('')===seg.join(''));qs.push({type:'order',line:l,seg,sh,built:[]})});
 Q={qs:shuffle(qs),i:0,score:0,wrongs:[],ctx,ans:null};stopAll();if(location.hash!=='#quiz')location.hash='#quiz';else render()}
function vQuiz(){if(!Q)return vReview();if(Q.i>=Q.qs.length)return quizEnd();const q=Q.qs[Q.i],done=Q.ans!=null;let h='';
 const head=`<div class="qhead"><button class="back" data-act="quitQuiz">‹ Thoát</button><span>Câu ${Q.i+1}/${Q.qs.length} · Đúng ${Q.score}</span></div><div class="prog"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>`;
 if(q.type==='order'){h=`<p class="qt">🧩 Sắp xếp thành câu đúng</p><p class="qmean">"${esc(q.line[3])}"</p>${btnSay(q.line[1],'🔊 Nghe câu','txt')}
  <div class="built zh">${q.built.map((x,i)=>`<button class="tok" data-act="unpick" data-i="${i}" ${done?'disabled':''}>${esc(q.sh[x])}</button>`).join('')||'<span class="small">Chạm các ô bên dưới theo đúng thứ tự</span>'}</div>
  <div class="pool zh">${q.sh.map((s,i)=>q.built.includes(i)?'':`<button class="tok" data-act="pickTok" data-i="${i}">${esc(s)}</button>`).join('')}</div>
  ${done?'':`<button class="btn" data-act="checkOrder" ${q.built.length===q.sh.length?'':'disabled'}>Kiểm tra</button>`}`}
 else{const w=q.w;const prompt={listen:`<p class="qt">👂 Nghe và chọn chữ đúng</p><button class="ib xl" data-act="say" data-zh="${esc(w.zh)}">🔊</button>`,
  meaning:`<p class="qt">Từ này nghĩa là gì?</p><div class="qz zh" data-act="say" data-zh="${esc(w.zh)}">${esc(w.zh)}</div><div class="pyb">${esc(w.py)}</div>`,
  reverse:`<p class="qt">Chọn chữ Hán đúng</p><div class="qem">${w.em||''}</div><div class="qmean">${esc(w.mean)}</div>`,
  tone:`<p class="qt">Chọn pinyin có thanh điệu đúng</p><div class="qz zh" data-act="say" data-zh="${esc(w.zh)}">${esc(w.zh)}</div><small class="hint">Chạm vào chữ để nghe</small>`}[q.type];
  h=`${prompt}<div class="opts ${q.type==='listen'||q.type==='reverse'?'zhopts':''}">${q.opts.map(o=>`<button class="opt ${done?(o===q.ans?'right':o===Q.ans?'wrongc':''):''}" data-act="answer" data-v="${esc(o)}" ${done?'disabled':''}><span class="${q.type==='listen'||q.type==='reverse'?'zh':''}">${esc(o)}</span>${done&&(q.type==='listen'||q.type==='reverse')&&DICT[o]?`<small>${esc(DICT[o].py)}</small>`:''}</button>`).join('')}</div>`}
 if(done){const ok=Q.ans===true||Q.ans===q.ans;const z=q.type==='order'?q.line[1]:q.w.zh;const py=q.type==='order'?q.line[2]:q.w.py;const mean=q.type==='order'?q.line[3]:q.w.mean;
  h+=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'✅ Chính xác!':'❌ Chưa đúng'}</b><div class="zh fbz">${esc(z)} ${btnSay(z)}</div><div class="pyb">${esc(py)}</div><div class="vi">${esc(toVi(py))}</div><div>${esc(mean)}</div></div><button class="btn big" data-act="nextQ">${Q.i+1<Q.qs.length?'Câu tiếp ›':'Xem kết quả'}</button>`}
 return head+`<div class="quiz">${h}</div>`}
function quizEnd(){const p=Math.round(Q.score/Q.qs.length*100);const c=Q.ctx;if(c.lesson&&!Q.saved){Q.saved=1;S.best[c.lesson]=Math.max(S.best[c.lesson]||0,p);if(p>=70)S.done[c.lesson]=1;save()}
 const ws=[...new Set(Q.wrongs)].map(z=>DICT[z]).filter(Boolean);
 return`<div class="result"><div class="rs">${p>=90?'🏆':p>=70?'🎉':'💪'}</div><h2>${Q.score}/${Q.qs.length} câu đúng · ${p}%</h2><p>${p>=70?(c.lesson?'Bạn đã hoàn thành bài này!':'Làm tốt lắm!'):'Cần đạt 70%. Ôn lại hội thoại rồi thử lại nhé.'}</p>
 <div class="pbar center"><button class="btn" data-act="redo">Làm lại</button>${c.lesson?`<a class="btn ghost" href="#lesson/${c.lesson}/dialog">Nghe lại hội thoại</a>${LESSONS.find(L=>L.id===c.lesson+1)?`<a class="btn ghost" href="#lesson/${c.lesson+1}/learn">Bài tiếp ›</a>`:''}`:'<a class="btn ghost" href="#review">Về Ôn tập</a>'}</div></div>
 ${ws.length?`<h3>Từ cần ôn lại</h3>${ws.map(w=>wordRow(w)).join('')}`:''}`}
function answer(v){const q=Q.qs[Q.i];if(Q.ans!=null)return;Q.ans=v;const ok=v===q.ans;markResult(q,ok);render()}
function markResult(q,ok){if(ok){Q.score++;if(q.w&&S.wrong[q.w.zh]&&Q.ctx.review){if(--S.wrong[q.w.zh]<=0)delete S.wrong[q.w.zh]}}
 else{const zs=q.w?[q.w.zh]:q.seg.filter(s=>DICT[s]);zs.forEach(z=>{S.wrong[z]=(S.wrong[z]||0)+1;Q.wrongs.push(z)})}save();speak(q.w?q.w.zh:q.line[1])}

const ACT={
 say:b=>speak(b.dataset.zh,b.dataset.slow?{rate:0.45}:{}),
 mic:b=>listen(b.dataset.zh,document.getElementById(b.dataset.out)),
 go:b=>location.hash=b.dataset.to,
 back:()=>history.back(),
 tog:b=>{S[b.dataset.k]=!S[b.dataset.k];save();b.classList.toggle('on',S[b.dataset.k]);applyPrefs()},
 known:b=>{const z=b.dataset.zh;if(S.known[z])delete S.known[z];else S.known[z]=1;save();b.textContent=S.known[z]?'⭐':'☆';b.classList.toggle('on',!!S.known[z])},
 cprev:()=>{C.i=(C.i-1+C.pool.length)%C.pool.length;$('#cards').innerHTML=cardView();speak(C.pool[C.i].zh)},
 cnext:()=>{C.i=(C.i+1)%C.pool.length;$('#cards').innerHTML=cardView();speak(C.pool[C.i].zh)},
 auto:()=>{if(auto){stopAll()}else{auto=true;runAuto()}$('#cards').innerHTML=cardView()},
 playAll:b=>{stopAll();playAll(LESSONS.find(L=>L.id==b.dataset.id))},
 stop:()=>{stopAll();document.querySelectorAll('.bub').forEach(x=>x.classList.remove('cur'))},
 tgStart:()=>{toneGame={i:0,score:0};tgNew();$('#tg').innerHTML=tgView()},
 tgPlay:()=>speak(toneGame.cur.zh),
 tgAns:b=>{const t=+b.dataset.t;toneGame.ans=t;if(t===toneGame.cur.t)toneGame.score++;$('#tg').innerHTML=tgView()},
 tgNext:()=>{toneGame.i++;if(toneGame.i<10)tgNew();$('#tg').innerHTML=tgView()},
 wlv:b=>{WF.lv=+b.dataset.lv;WF.topic='';render()},
 slv:b=>{S.lv=+b.dataset.lv;WF.lv=S.lv;WF.topic='';save();if(b.dataset.to&&location.hash!==b.dataset.to)location.hash=b.dataset.to;else render()},
 slvr:b=>{S.lv=+b.dataset.lv;WF.lv=S.lv;WF.topic='';save();render()},
 wtopic:b=>{WF.topic=b.dataset.t;render()},
 wcards:()=>{C={key:'W',pool:wordList(),i:0,title:WF.topic||'Từ vựng HSK'+WF.lv};location.hash='#cards'},
 wquiz:()=>{const ws=wordList();startQuiz(ws,{n:Math.min(15,Math.max(4,ws.length)),orders:0,ctx:{}})},
 quizLesson:b=>{const L=LESSONS.find(x=>x.id==b.dataset.id);startQuiz(lessonWords(L),{lines:L.lines,n:12,orders:3,ctx:{lesson:L.id}})},
 quizAll:()=>startQuiz(lvBank(),{lines:allLines(),n:20,orders:4,ctx:{}}),
 quizWrong:()=>{const ws=Object.keys(S.wrong).map(z=>DICT[z]).filter(Boolean);startQuiz(ws,{n:Math.min(15,ws.length),orders:0,ctx:{review:1}})},
 quizListen:()=>startQuiz(lvBank(),{n:15,types:['listen'],orders:0,ctx:{}}),
 quizOrder:()=>startQuiz([],{lines:allLines(),n:8,orders:8,ctx:{}}),
 answer:b=>answer(b.dataset.v),
 pickTok:b=>{Q.qs[Q.i].built.push(+b.dataset.i);render()},
 unpick:b=>{Q.qs[Q.i].built.splice(+b.dataset.i,1);render()},
 checkOrder:()=>{const q=Q.qs[Q.i];const ok=q.built.map(i=>q.sh[i]).join('')===q.seg.join('');Q.ans=ok?true:false;markResult(q,ok);render()},
 nextQ:()=>{Q.i++;Q.ans=null;Q.spoke=0;render();scrollTo(0,0)},
 redo:()=>{const qs=Q.qs.map(q=>q.type==='order'?{...q,built:[]}:q);Q={qs:shuffle(qs),i:0,score:0,wrongs:[],ctx:Q.ctx,ans:null};render()},
 quitQuiz:()=>{stopAll();history.length>1?history.back():location.hash='#review'},
 reset:()=>{if(confirm('Xóa toàn bộ tiến độ học?')){S.done={};S.best={};S.known={};S.wrong={};save();render()}},
};
Object.assign(ACT,ACT_V);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;e.preventDefault();ACT[b.dataset.act]?.(b,e)});
document.addEventListener('input',e=>{if(e.target.id==='wq'){WF.q=e.target.value;$('#wl').innerHTML=wlView();applyPrefs()}});
document.querySelector('.tabbar').innerHTML=TABS.map(([k,i,n])=>`<a href="#${k}" data-t="${k}"><span>${i}</span>${n}</a>`).join('');
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
</body>
</html>
